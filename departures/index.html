<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Departures · Offline travel games for the airport and the plane</title>
  <meta name="description" content="Six quick games for the airport and the plane. Works with no signal, no wi-fi and no adverts — install it to your home screen before you fly." />
  <meta name="theme-color" content="#0d1526" />
  <meta name="color-scheme" content="dark light" />
  <link rel="canonical" href="https://jsip.uk/departures/" />

  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Departures" />
  <meta property="og:title" content="Departures · Offline travel games" />
  <meta property="og:description" content="Six quick games for the airport and the plane. No signal needed." />
  <meta property="og:url" content="https://jsip.uk/departures/" />

  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Departures" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <a class="skip-link" href="#screen">Skip to content</a>

  <header class="topbar" id="topbar">
    <button class="icon-btn" id="back-btn" hidden aria-label="Back to all games">
      <span aria-hidden="true">‹</span>
    </button>
    <div class="topbar-title">
      <span class="topbar-mark" aria-hidden="true">✈</span>
      <h1 id="topbar-heading">Departures</h1>
    </div>
    <div class="topbar-actions">
      <button class="icon-btn" id="help-btn" hidden aria-label="How to play">?</button>
      <button class="icon-btn" id="settings-btn" aria-label="Settings">⚙</button>
    </div>
  </header>

  <main id="screen" class="screen" tabindex="-1"></main>

  <div class="sheet-backdrop" id="sheet-backdrop" hidden></div>
  <section class="sheet" id="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="sheet-title">
    <div class="sheet-grip" aria-hidden="true"></div>
    <h2 id="sheet-title">Settings</h2>
    <div id="sheet-body"></div>
    <button class="btn btn-ghost sheet-close" id="sheet-close">Close</button>
  </section>

  <noscript>
    <p style="padding:2rem;text-align:center">Departures needs JavaScript switched on to run.</p>
  </noscript>

  <script src="app.js" defer></script>
  <script src="data.js" defer></script>
  <script src="words.js" defer></script>
  <script src="games/cloud-hop.js" defer></script>
  <script src="games/baggage-match.js" defer></script>
  <script src="games/dots-and-boxes.js" defer></script>
  <script src="games/sky-quiz.js" defer></script>
  <script src="games/word-wings.js" defer></script>
  <script src="games/airport-bingo.js" defer></script>
  <script src="boot.js" defer></script>
</body>
</html>
