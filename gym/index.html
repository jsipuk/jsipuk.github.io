<!DOCTYPE html>
<html lang="en-GB" data-theme="system">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gym by John</title>
<meta name="description" content="A private, offline gym workout tracker. Plan your workout, log every set, and never lose your place.">

<!-- Installed-app behaviour on iOS and Android -->
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Gym">
<meta name="format-detection" content="telephone=no">
<!-- Kept in sync with the resolved theme by app.js -->
<meta name="theme-color" id="theme-color" content="#ffffff">

<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<link rel="icon" href="assets/icons/favicon-32.png" sizes="32x32">

<link rel="stylesheet" href="css/reset.css">
<link rel="stylesheet" href="css/variables.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<!-- Shown until the first screen is painted, then faded out. -->
<div id="splash" role="status" aria-label="Loading Gym by John">
  <div class="splash-inner">
    <img src="assets/icons/icon-512.png" alt="" width="96" height="96">
    <div class="splash-name">Gym by John</div>
    <div class="splash-tag">Train. Track. Progress.</div>
  </div>
</div>

<div id="app">
  <main id="screen" aria-live="polite"></main>
  <nav id="tabbar" class="tabbar" aria-label="Sections" hidden></nav>
</div>

<!-- Sheets, the quick menu, the image viewer and toasts mount here. -->
<div id="overlays"></div>
<div id="toasts" class="toast-stack" aria-live="polite"></div>

<noscript>
  <p style="padding:24px;font-family:system-ui">Gym by John needs JavaScript. It runs entirely on your device — nothing is sent anywhere.</p>
</noscript>

<script type="module" src="js/app.js"></script>
</body>
</html>
