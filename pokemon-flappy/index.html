// ─── CANVAS & STATE ───────────────────────────────────────────────────────────

const canvas = document.getElementById('gc');
const ctx    = canvas.getContext('2d');

// ─── LAYOUT ───────────────────────────────────────────────────────────────────
// The play field has a FIXED logical HEIGHT. Every physics constant (gravity,
// flap impulse, pipe gap) and every piece of background art is tuned against
// 600 units, so locking it guarantees the game feels the same everywhere.
// The logical WIDTH flexes to match the device aspect instead — that's what
// lets the canvas fill a tall phone screen edge-to-edge with no black bars.
const CH = 600;

function viewport() {
  const vp = window.visualViewport;
  return {
    w: window.innerWidth || 400,
    h: (vp ? vp.height : window.innerHeight) || 600,
  };
}

const CW = (() => {
  const { w, h } = viewport();
  // Desktop / landscape keeps the classic 2:3 field.
  if (w >= 560 || h <= w) return 400;
  // Portrait phone: derive width from the real aspect, clamped so that
  // freakishly narrow or wide devices still get a playable field.
  return Math.round(Math.max(258, Math.min(400, CH * w / h)));
})();

// Pipes must cross a narrow field in the same number of SECONDS as a wide one,
// otherwise phone players get less reaction time than desktop players.
// Scaling horizontal speed by the width ratio makes time-to-cross constant.
const WSCALE = CW / 400;

// Fit the canvas to the viewport and give it a backing store at device
// resolution so the art stays crisp when scaled up on retina screens.
function fitToScreen() {
  const { w, h } = viewport();
  const s  = Math.min(w / CW, h / CH);
  const dw = Math.round(CW * s), dh = Math.round(CH * s);
  const bs = Math.min(window.devicePixelRatio || 1, 2.5);

  const wrap = document.getElementById('wrap');
  if (wrap) { wrap.style.width = dw + 'px'; wrap.style.height = dh + 'px'; }

  canvas.style.width = dw + 'px'; canvas.style.height = dh + 'px';
  canvas.width  = Math.round(dw * bs);
  canvas.height = Math.round(dh * bs);
  // Map the logical CW×CH field onto the backing store.
  ctx.setTransform(canvas.width / CW, 0, 0, canvas.height / CH, 0, 0);
}
fitToScreen();

// Re-fit on rotate / browser-chrome show-hide. CW stays fixed for the session
// so difficulty never shifts mid-run; an orientation flip just letterboxes.
addEventListener('resize', fitToScreen);
addEventListener('orientationchange', () => setTimeout(fitToScreen, 120));
if (window.visualViewport) visualViewport.addEventListener('resize', fitToScreen);

// Offscreen caches still render at a fixed ratio — 2 is plenty for scenery.
const DPR = Math.min(window.devicePixelRatio || 1, 2);

let selectedChar = CHARS[0];
let score = 0;
let bestScore = (() => { try { return Math.max(0, parseInt(localStorage.getItem('pkflap_best'), 10) || 0); } catch(e) { return 0; } })();
let gamePhase = 'idle'; // 'idle' | 'playing' | 'dead'
let curScreen = 'start'; // 'start' | 'select' | 'gameover' | 'game'
let paused = false;
let runStartBest = bestScore, newBest = false;

// ─── SOUND (synthesised — no audio assets) ────────────────────────────────────

const SFX = (() => {
  let ac = null, muted = (() => { try { return localStorage.getItem('pkflap_mute') === '1'; } catch(e) { return false; } })();
  function ensureAC() {
    if (!ac) {
      try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {}
    }
    if (ac && ac.state === 'suspended') ac.resume();
    return ac;
  }
  function tone(freq, dur, type, vol, slide, delay) {
    if (muted) return;
    try {
      const a = ensureAC();
      if (!a) return;
      const t = a.currentTime + (delay || 0);
      const o = a.createOscillator(), g = a.createGain();
      o.type = type; o.frequency.setValueAtTime(freq, t);
      if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, freq + slide), t + dur);
      g.gain.setValueAtTime(vol, t);
      g.gain.exponentialRampToValueAtTime(.001, t + dur);
      o.connect(g); g.connect(a.destination);
      o.start(t); o.stop(t + dur + .02);
    } catch (e) { /* no audio available — play silently */ }
  }
  return {
    flap()   { tone(440, .09, 'triangle', .15, 240); },
    score()  { tone(660, .08, 'square', .08); tone(880, .1, 'square', .08, 0, .07); },
    ball()   { tone(523, .07, 'sine', .15); tone(784, .08, 'sine', .15, 0, .06); tone(1047, .12, 'sine', .15, 0, .12); },
    hit()    { tone(160, .22, 'sawtooth', .2, -100); tone(500, .35, 'square', .07, -420, .08); },
    // The Pokémon Center healing chime — the most recognisable four notes in
    // Gen 1. Rising D–F#–A–D on a soft triangle, then a held major third.
    heal()   {
      const N = [587, 740, 880, 1175];
      N.forEach((f, i) => tone(f, .16, 'triangle', .13, 0, i * .13));
      tone(1175, .5, 'triangle', .10, 0, .52);
      tone(1480, .5, 'triangle', .07, 0, .52);
    },
    unlock() { ensureAC(); },
    isMuted()  { return muted; },
    toggle()   { muted = !muted; try { localStorage.setItem('pkflap_mute', muted ? '1' : '0'); } catch(e) {} return muted; },
  };
})();

// Unlock AudioContext on first user gesture — critical for iOS Safari
document.addEventListener('touchstart', () => SFX.unlock(), { once: true, passive: true });
document.addEventListener('click',      () => SFX.unlock(), { once: true, passive: true });

function buzz(ms) { if (navigator.vibrate) try { navigator.vibrate(ms); } catch (e) {} }

// ─── PARTICLES & SCREEN JUICE ─────────────────────────────────────────────────

let parts = [];
let rings = [];                                  // expanding shockwave rings
let shake = 0, flash = 0, scorePop = 0;
let flapAnim = 0;                                // 1 → 0 after each flap, drives the wing beat
let banner = 0, bannerText = '';                 // transient mid-run celebration text

function burst(x, y, n, col, spd) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, v = Math.random() * (spd || 2.5) + .8;
    parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 1, life: 1, col, r: Math.random() * 2.5 + 1.5 });
  }
}

function ring(x, y, col, max) {
  rings.push({ x, y, r: 4, max: max || 46, life: 1, col });
}

// Ground
const GH = 58;

// A tall phone field has more vertical room than the 400×600 reference. Left
// alone that makes the game easier there and leaves the pipes looking sparse,
// so the surplus becomes a sky margin above the play band instead. The band
// then holds the same number of bird-heights on every device, and the extra
// sky is where the sun, clouds and score already live — nothing is wasted.
const TOP = Math.max(0, (CH - GH) - 542 * WSCALE);
const BAND_MID = TOP + (CH - GH - TOP) / 2;

// Every spatial quantity scales by WSCALE so the game is geometrically
// SIMILAR on every device — the bird, the pipes and the gap keep the same
// proportions to each other and to the field. Because gravity and the flap
// impulse scale together, the trajectory changes size but not TIMING, so the
// rhythm of the game is identical everywhere.
const BIRD_X  = Math.round(CW * .22);
const BIRD_R  = 22 * WSCALE;
const GRAVITY = 0.35 * WSCALE;
const FLAP_V  = -6.8 * WSCALE;
const VY_MAX  = 9 * WSCALE;    // terminal velocity

let bird = { y:BAND_MID, vy:0, angle:0 };

// Pipes
const PIPE_W = 58 * WSCALE;
let pipes = [];
let pipeTimer = 0;

// Ground scroll offsets
let groundX = 0;  // wrapped offset for ground tufts, derived from scrollX
let scrollX = 0;  // continuous distance travelled — keeps grass layers seam-free

// Clouds — positions proportional so they spread across any field width
let clouds = [
  {x:CW*.20, y:75,  w:90,  spd:.4  * WSCALE},
  {x:CW*.66, y:130, w:70,  spd:.35 * WSCALE},
  {x:CW*.41, y:48,  w:110, spd:.5  * WSCALE},
];

// Butterfree flying the opposite direction to the game scroll
let bgFlyer = { x: CW * .5, baseY: 152 };

// Poké Ball pickups — drift between pipes, +1 bonus point when collected
let balls = [];

// Day → sunset → night cycle, advancing one phase every 10 points (loops)
let skyCur = 0;

// Fixed starfield for the night sky
const STARS = Array.from({ length: 34 }, () => ({
  x: Math.random() * CW, y: Math.random() * 300,
  r: Math.random() * 1.3 + .5, tw: Math.random() * Math.PI * 2,
}));

// ─── DIFFICULTY ───────────────────────────────────────────────────────────────

function diff() {
  const t = Math.min(score, 50);
  return {
    // speed scales with field width so time-to-cross is device-independent
    speed:  (2.0 + t * 0.055) * WSCALE,
    // gap scales with the bird so it stays the same number of bird-heights
    gap:    Math.max(105, 170 - t * 1.3) * WSCALE,
    spawn:  Math.max(58, 95 - t * 0.75),   // in frames — identical everywhere
  };
}

// ─── GAME LOGIC ───────────────────────────────────────────────────────────────

function resetGame() {
  bird = { y:BAND_MID, vy:0, angle:0 };
  pipes = [];
  balls = [];
  parts = [];
  rings = [];
  pipeTimer = 0;
  groundX = scrollX = 0;
  score = 0;
  shake = flash = scorePop = flapAnim = banner = 0;
  skyCur = 0;
  runStartBest = bestScore;
  newBest = false;
  paused = false;
  gamePhase = 'idle';
}

function flap() {
  if (curScreen !== 'game') return;
  if (paused) { paused = false; return; }
  if (gamePhase === 'dead') return;
  if (gamePhase === 'idle') gamePhase = 'playing';
  bird.vy = FLAP_V;
  flapAnim = 1;
  SFX.flap();
  // little air puff under the tail
  for (let i = 0; i < 4; i++) parts.push({
    x: BIRD_X - 14 * WSCALE + Math.random() * 8, y: bird.y + 16 * WSCALE,
    vx: -1 - Math.random(), vy: .5 + Math.random(), life: .7,
    col: 'rgba(255,255,255,.9)', r: Math.random() * 2 + 1.5,
  });
}

function addPoint(quiet) {
  score++; scorePop = 1;
  if (!quiet) { SFX.score(); buzz(10); }
  if (score > bestScore) {
    bestScore = score;
    try { localStorage.setItem('pkflap_best', bestScore); } catch(e) {}
  }
  // The moment you overtake your old record, celebrate it in the run itself
  // rather than saving the news for the game-over screen.
  if (score > runStartBest) {
    if (!newBest && runStartBest > 0) {
      SFX.heal(); buzz([0, 30, 40, 30]);
      banner = 1; bannerText = 'NEW BEST!';
      ring(BIRD_X, bird.y, '#FFD700', 90);
      burst(BIRD_X, bird.y, 16, '#FFD700', 3.2);
    }
    newBest = true;
  }
}

function update(dt) {
  const d = diff();
  clouds.forEach(c => { c.x -= c.spd * dt; if (c.x + c.w < 0) c.x = CW + c.w; });
  bgFlyer.x += 0.55 * dt; if (bgFlyer.x > CW + 60) bgFlyer.x = -60;

  // Juice decay + particle physics run in every phase
  shake    = Math.max(0, shake - .6 * dt);
  flash    = Math.max(0, flash - .05 * dt);
  scorePop = Math.max(0, scorePop - .06 * dt);
  flapAnim = Math.max(0, flapAnim - .11 * dt);
  banner   = Math.max(0, banner - .012 * dt);
  for (const p of parts) { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += .1 * dt; p.life -= .035 * dt; }
  parts = parts.filter(p => p.life > 0);
  for (const r of rings) { r.r += (r.max - r.r) * .18 * dt; r.life -= .06 * dt; }
  rings = rings.filter(r => r.life > 0);

  // Sky eases toward the phase set by score
  skyCur += (score / 10 - skyCur) * Math.min(.02 * dt, 1);

  if (gamePhase !== 'playing') {
    if (gamePhase === 'idle') { bird.y = BAND_MID + Math.sin(Date.now()*.002)*12*WSCALE; bird.angle = 0; }
    if (gamePhase === 'dead' && bird.y + BIRD_R < CH - GH + 14) {
      // tumble to the ground
      bird.vy += GRAVITY * dt;
      bird.y += bird.vy * dt;
      bird.angle = Math.min(bird.angle + .06 * dt, 1.35);
    }
    return;
  }

  bird.vy   += GRAVITY * dt;
  bird.vy    = Math.min(bird.vy, VY_MAX);   // terminal velocity — no runaway drops
  bird.y    += bird.vy * dt;
  bird.angle = Math.atan2(bird.vy, VY_MAX) * .65;
  scrollX   += d.speed * dt;
  groundX    = -(scrollX % 40);

  pipeTimer += dt;
  if (pipeTimer >= d.spawn) {
    pipeTimer = 0;
    const margin = 70 * WSCALE;
    const minGap = TOP + margin, maxGap = CH - GH - d.gap - margin;
    pipes.push({ x: CW + 20, gy: minGap + Math.random() * (maxGap - minGap), gap: d.gap, scored: false });
    // Sometimes drop a Poké Ball halfway to the next pipe
    if (Math.random() < .35) balls.push({
      x: CW + 20 + d.spawn * d.speed * .5,
      y: TOP + margin + Math.random() * Math.max(40, CH - GH - TOP - margin * 2),
      rot: Math.random() * Math.PI * 2, got: false,
    });
  }

  for (const p of pipes) {
    p.x -= d.speed * dt;
    if (!p.scored && p.x + PIPE_W < BIRD_X) {
      p.scored = true; addPoint();
      burst(BIRD_X + 18 * WSCALE, bird.y, 6, '#FFE060', 2);
    }
  }
  pipes = pipes.filter(p => p.x > -PIPE_W - 20);

  for (const b of balls) {
    b.x -= d.speed * dt; b.rot += .04 * dt;
    if (!b.got && Math.hypot(b.x - BIRD_X, b.y - bird.y) < BIRD_R + 12 * WSCALE) {
      b.got = true; addPoint(true); SFX.ball(); buzz(12);
      burst(b.x, b.y, 12, '#FF4444', 3);
      burst(b.x, b.y, 8, '#FFFFFF', 2.2);
      ring(b.x, b.y, '#FFFFFF', 52);
      ring(b.x, b.y, '#FFE45C', 38);
      flash = Math.max(flash, .18);
    }
  }
  balls = balls.filter(b => !b.got && b.x > -30);

  if (bird.y - BIRD_R < TOP) { bird.y = TOP + BIRD_R; bird.vy = Math.max(0, bird.vy); }
  if (bird.y + BIRD_R > CH - GH) { die(); return; }

  const FG = 5 * WSCALE;
  for (const p of pipes) {
    if (BIRD_X + BIRD_R - FG > p.x && BIRD_X - BIRD_R + FG < p.x + PIPE_W) {
      if (bird.y - BIRD_R + FG < p.gy || bird.y + BIRD_R - FG > p.gy + p.gap) { die(); return; }
    }
  }
}

function die() {
  gamePhase = 'dead'; bird.vy = -5 * WSCALE;
  SFX.hit(); buzz(60);
  shake = 11; flash = .55;
  burst(BIRD_X, bird.y, 14, '#FFFFFF', 3.5);
  burst(BIRD_X, bird.y, 10, selectedChar.col, 3);
  setTimeout(() => {
    document.getElementById('go-score').textContent = score;
    document.getElementById('go-best').textContent = bestScore;

    // Four tiers, Flappy Bird style — drawn, not emoji, so they match the art
    const tier = score >= 40 ? 3 : score >= 25 ? 2 : score >= 15 ? 1 : score >= 8 ? 0 : -1;
    const mEl = document.getElementById('go-medal');
    mEl.classList.toggle('hide', tier < 0);
    if (tier >= 0) drawMedal(mEl, tier);

    document.getElementById('go-newbest').classList.toggle('hide', !(newBest && score > 0));
    showScreen('gameover');
    if (tier >= 2) SFX.heal();
  }, 700);
}

// ─── RENDERING ────────────────────────────────────────────────────────────────

// Sky gradients are built once, not per frame
const SKIES = [
  ['#4899D8', '#98D4F8', '#C8EEBB'],   // day
  ['#5858A8', '#F88860', '#FFD8A0'],   // sunset
  ['#0A1038', '#283068', '#3A4880'],   // night
].map(stops => {
  const g = ctx.createLinearGradient(0, 0, 0, CH);
  g.addColorStop(0, stops[0]); g.addColorStop(.5, stops[1]); g.addColorStop(1, stops[2]);
  return g;
});

function nightAmount() {
  const p = ((skyCur % 3) + 3) % 3;
  const d = Math.min(Math.abs(p - 2), 3 - Math.abs(p - 2));
  return Math.max(0, 1 - d);
}

function render() {
  // Sky: crossfade between the current phase and the next
  const p = ((skyCur % 3) + 3) % 3, pi = Math.floor(p) % 3, pf = p - Math.floor(p);
  ctx.fillStyle = SKIES[pi]; ctx.fillRect(0, 0, CW, CH);
  if (pf > .001) {
    ctx.globalAlpha = pf;
    ctx.fillStyle = SKIES[(pi + 1) % 3]; ctx.fillRect(0, 0, CW, CH);
    ctx.globalAlpha = 1;
  }

  ctx.save();
  if (shake > 0) ctx.translate((Math.random() - .5) * shake, (Math.random() - .5) * shake);

  const night = nightAmount();
  if (night > .05) drawStars(night);
  drawSun(night);
  drawScenery();
  clouds.forEach(c => drawCloud(c.x, c.y, c.w));
  drawBgButterfree(bgFlyer.x, bgFlyer.baseY + Math.sin(Date.now() * .0009) * 14);
  pipes.forEach(pp => drawPipe(pp));
  balls.forEach(b => drawPokeball(b));
  drawGround();
  // Wild Pokémon drawn after grass so they appear in front of it
  drawOddish(ctx, CW * .23, CH - GH);
  drawOddish(ctx, CW * .76, CH - GH);
  drawDiglett(ctx, CW * .87, CH - GH);

  drawPlayer();

  for (const pt of parts) {
    ctx.globalAlpha = Math.max(0, Math.min(1, pt.life));
    ctx.fillStyle = pt.col;
    ctx.beginPath(); ctx.arc(pt.x, pt.y, pt.r, 0, Math.PI * 2); ctx.fill();
  }
  // Catch rings — the Poké Ball "gotcha" pulse
  for (const r of rings) {
    ctx.globalAlpha = Math.max(0, r.life) * .8;
    ctx.strokeStyle = r.col; ctx.lineWidth = 3 * r.life + .6;
    ctx.beginPath(); ctx.arc(r.x, r.y, r.r, 0, Math.PI * 2); ctx.stroke();
  }
  ctx.globalAlpha = 1;

  ctx.restore();

  // Atmosphere + impact overlays
  if (night > .05) { ctx.fillStyle = 'rgba(10,15,50,' + (night * .38).toFixed(3) + ')'; ctx.fillRect(0, 0, CW, CH); }
  if (flash > 0)   { ctx.fillStyle = 'rgba(255,255,255,' + flash.toFixed(3) + ')'; ctx.fillRect(0, 0, CW, CH); }

  if (gamePhase === 'playing' || gamePhase === 'dead') drawScoreHUD();
  if (gamePhase === 'idle' && curScreen === 'game') drawTapHint();
  if (banner > 0) drawBanner();
  if (paused) drawPaused();
}

// The player is drawn through a squash-and-stretch transform driven by
// flapAnim, so every character gets a readable wing beat without any of the
// eight character functions needing to know about it.
function drawPlayer() {
  const f = flapAnim;
  const ease = f * f;                       // sharp on the beat, soft on release

  // Beat arcs sweeping off the shoulders — reads as wings catching air
  if (f > .05) {
    ctx.save();
    ctx.globalAlpha = f * .5;
    ctx.strokeStyle = '#FFFFFF'; ctx.lineWidth = 2.4; ctx.lineCap = 'round';
    const spread = 16 + (1 - f) * 20;
    for (const dir of [-1, 1]) {
      ctx.beginPath();
      ctx.arc(BIRD_X, bird.y + 2, BIRD_R + spread * .5,
              dir < 0 ? Math.PI * 1.05 : Math.PI * 1.75,
              dir < 0 ? Math.PI * 1.25 : Math.PI * 1.95);
      ctx.stroke();
    }
    ctx.restore();
  }

  ctx.save();
  ctx.translate(BIRD_X, bird.y);
  // Stretch tall on the upbeat, settle back to round — classic game-feel juice
  ctx.scale(1 - ease * .11, 1 + ease * .15);
  ctx.translate(-BIRD_X, -bird.y);
  selectedChar.draw(ctx, BIRD_X, bird.y, BIRD_R * 2, bird.angle);
  ctx.restore();
}

function drawStars(a) {
  const t = Date.now() * .002;
  ctx.fillStyle = '#FFF8D8';
  for (const st of STARS) {
    ctx.globalAlpha = a * (.4 + .6 * Math.abs(Math.sin(t + st.tw)));
    ctx.beginPath(); ctx.arc(st.x, st.y, st.r, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;
}

// Static scenery (mountains, Pokémon Center, trees, Oddish) is pre-rendered
// once to an offscreen canvas — a single drawImage per frame after that
let sceneryCache = null;
function drawScenery() {
  if (!sceneryCache) {
    sceneryCache = document.createElement('canvas');
    sceneryCache.width = CW * DPR; sceneryCache.height = CH * DPR;
    const g = sceneryCache.getContext('2d');
    g.setTransform(DPR, 0, 0, DPR, 0, 0);
    drawMountains(g);
  }
  ctx.drawImage(sceneryCache, 0, 0, CW, CH);
}

function drawPokeball(b) {
  const r = 12 * WSCALE;
  ctx.save();
  ctx.translate(b.x, b.y + Math.sin(Date.now() * .004 + b.rot) * 3);
  ctx.rotate(Math.sin(b.rot) * .25);
  ctx.fillStyle = '#F8F8F8';
  ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI); ctx.fill();
  ctx.fillStyle = '#E83030';
  ctx.beginPath(); ctx.arc(0, 0, r, Math.PI, 0); ctx.fill();
  ctx.fillStyle = '#222';
  ctx.fillRect(-r, -1.6, r * 2, 3.2);
  ctx.beginPath(); ctx.arc(0, 0, 4, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(0, 0, 2.2, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,.55)'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.stroke();
  ctx.fillStyle = 'rgba(255,255,255,.5)';
  ctx.beginPath(); ctx.ellipse(-4, -6, 3, 2, -.6, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}

function drawPaused() {
  ctx.fillStyle = 'rgba(0,0,0,.45)'; ctx.fillRect(0, 0, CW, CH);
  ctx.fillStyle = '#fff'; ctx.font = 'bold 26px Arial';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('Paused', CW / 2, CH / 2 - 16);
  ctx.font = 'bold 15px Arial';
  ctx.fillText('Tap / Space to resume', CW / 2, CH / 2 + 16);
}

// ─── SUN ─────────────────────────────────────────────────────────────────────

const SUN_GLOW = (() => {
  const g = ctx.createRadialGradient(CW-60,58,10, CW-60,58,32);
  g.addColorStop(0,'rgba(255,240,80,.55)'); g.addColorStop(1,'rgba(255,220,0,0)');
  return g;
})();

function drawSun(night) {
  const sx = CW - 60, sy = 58;
  const day = 1 - (night || 0);
  if (day > .03) {
    ctx.globalAlpha = day;
    // Rotating rays
    ctx.strokeStyle = 'rgba(255,230,60,.65)'; ctx.lineWidth = 3; ctx.lineCap = 'round';
    const rot = Date.now() * .0003;
    for (let i = 0; i < 8; i++) {
      const a = i * Math.PI / 4 + rot;
      ctx.beginPath();
      ctx.moveTo(sx + Math.cos(a)*25, sy + Math.sin(a)*25);
      ctx.lineTo(sx + Math.cos(a)*38, sy + Math.sin(a)*38);
      ctx.stroke();
    }
    ctx.lineCap = 'butt';
    // Glow halo
    ctx.fillStyle = SUN_GLOW; ctx.beginPath(); ctx.arc(sx,sy,32,0,Math.PI*2); ctx.fill();
    // Sun disc
    ctx.fillStyle = '#FFE830'; ctx.beginPath(); ctx.arc(sx,sy,20,0,Math.PI*2); ctx.fill();
    ctx.fillStyle = '#FFF260'; ctx.beginPath(); ctx.arc(sx,sy,14,0,Math.PI*2); ctx.fill();
    ctx.globalAlpha = 1;
  }
  if (night > .03) {
    // Moon with craters
    ctx.globalAlpha = night;
    ctx.fillStyle = '#E8E8D8'; ctx.beginPath(); ctx.arc(sx, sy, 17, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = 'rgba(180,180,160,.55)';
    ctx.beginPath(); ctx.arc(sx-5, sy-3, 4, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(sx+6, sy+5, 3, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(sx+2, sy-8, 2.2, 0, Math.PI*2); ctx.fill();
    ctx.globalAlpha = 1;
  }
}

// ─── MOUNTAINS ───────────────────────────────────────────────────────────────

// All scenery is laid out as FRACTIONS of CW so the composition holds together
// at any field width — 258 units on a tall phone or 400 on desktop.
function drawMountains(g) {
  const groundY = CH - GH;

  // ── Far layer: pale blue-violet peaks, evenly spread across the field ──
  // Peak count follows width so the range never looks stretched or crowded.
  const N = Math.max(6, Math.round(CW / 47));
  const peaks = [];
  g.fillStyle = 'rgba(160,168,210,.65)';
  g.beginPath(); g.moveTo(0, groundY); g.lineTo(0, 275);
  for (let i = 0; i <= N; i++) {
    const x = (i / N) * CW;
    const tall = i % 2 === 0;
    // Deterministic pseudo-variation — same silhouette every load, no RNG
    const y = tall ? 186 + ((i * 37) % 23) : 222 + ((i * 53) % 27);
    g.lineTo(x, y);
    if (tall) peaks.push([x, y]);
  }
  g.lineTo(CW, groundY); g.closePath(); g.fill();

  // Snow caps on the tall peaks
  g.fillStyle = 'rgba(240,245,255,.7)';
  peaks.forEach(([px, py]) => {
    g.beginPath(); g.moveTo(px, py);
    g.lineTo(px - 14, py + 22); g.lineTo(px + 14, py + 22);
    g.closePath(); g.fill();
  });

  // ── Near layer: rolling green hills, drawn as two overlapping bands so the
  // lower half of the screen reads as depth rather than one flat green wall.
  const hx = f => f * CW;

  function hillBand(topY, amp, fill) {
    const waves = Math.max(3, Math.round(CW / 110));
    g.fillStyle = fill;
    g.beginPath(); g.moveTo(0, groundY); g.lineTo(0, topY + amp * .6);
    for (let i = 0; i < waves; i++) {
      const x0 = (i / waves) * CW, x1 = ((i + 1) / waves) * CW;
      const crest = topY - (i % 2 === 0 ? amp : amp * .25);
      g.quadraticCurveTo((x0 + x1) / 2, crest, x1, topY + amp * .5 - (i % 3) * amp * .18);
    }
    g.lineTo(CW, groundY); g.lineTo(0, groundY);
    g.closePath(); g.fill();
  }

  // Far band — the crest the Pokémon Center and trees stand on
  hillBand(348, 30, 'rgba(104,172,104,.62)');
  // Near band — lighter, lower, gives a second horizon line
  hillBand(432, 22, 'rgba(126,192,110,.55)');

  // ── Trees on the far crest ──
  [[.10, 356], [.27, 344], [.58, 350], [.80, 344], [.94, 354]]
    .forEach(([f, ty]) => drawTree(g, hx(f), ty));

  // ── Pokémon Center, sitting on the hill crest ──
  drawPokeCenter(g, hx(.45), 344);
  // (Oddish and Diglett are drawn live after the grass strip, not cached here)
}

function drawTree(ctx, tx, ty) {
  ctx.fillStyle = 'rgba(50,120,50,.7)';
  // Three layered triangles (fir tree silhouette)
  ctx.beginPath(); ctx.moveTo(tx,ty-28); ctx.lineTo(tx-12,ty-8); ctx.lineTo(tx+12,ty-8); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(tx,ty-18); ctx.lineTo(tx-14,ty-2); ctx.lineTo(tx+14,ty-2); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(tx,ty-8); ctx.lineTo(tx-10,ty+6); ctx.lineTo(tx+10,ty+6); ctx.closePath(); ctx.fill();
  // Trunk
  ctx.fillStyle = 'rgba(100,60,20,.6)';
  ctx.fillRect(tx-3, ty+5, 6, 8);
}

// ─── CLOUD ────────────────────────────────────────────────────────────────────

function drawCloud(x, y, w) {
  ctx.fillStyle = 'rgba(255,255,255,.84)';
  ctx.beginPath(); ctx.arc(x,        y,    w*.28, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(x+w*.28,  y-w*.12,w*.2, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(x+w*.52,  y,    w*.23, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(x+w*.18,  y+w*.06,w*.18,0, Math.PI*2); ctx.fill();
}

// ─── PIPES ───────────────────────────────────────────────────────────────────

function drawPipe(p) {
  const capH = 18 * WSCALE, capX = p.x - 5 * WSCALE, capW = PIPE_W + 10 * WSCALE;

  // Top pipe body
  ctx.fillStyle = '#2A8A45';
  ctx.fillRect(p.x, 0, PIPE_W, p.gy - capH);
  ctx.fillStyle = '#38A858';
  ctx.fillRect(capX, p.gy - capH, capW, capH);
  ctx.fillStyle = 'rgba(255,255,255,.18)';
  ctx.fillRect(p.x+5*WSCALE, 0, 8*WSCALE, p.gy - capH);
  ctx.fillStyle = '#1A6030';
  ctx.fillRect(p.x, 0, 4*WSCALE, p.gy - capH);
  ctx.fillRect(capX, p.gy-capH, 4*WSCALE, capH);
  // Leaf tufts on top pipe cap
  drawPipeLeaves(p.x + PIPE_W/2, p.gy - capH, false);

  // Bottom pipe body
  const by = p.gy + p.gap, bh = CH - GH - by;
  ctx.fillStyle = '#2A8A45';
  ctx.fillRect(p.x, by + capH, PIPE_W, bh - capH);
  ctx.fillStyle = '#38A858';
  ctx.fillRect(capX, by, capW, capH);
  ctx.fillStyle = 'rgba(255,255,255,.18)';
  ctx.fillRect(p.x+5*WSCALE, by+capH, 8*WSCALE, bh-capH);
  ctx.fillStyle = '#1A6030';
  ctx.fillRect(p.x, by+capH, 4*WSCALE, bh-capH);
  ctx.fillRect(capX, by, 4*WSCALE, capH);
  // Leaf tufts on bottom pipe cap
  drawPipeLeaves(p.x + PIPE_W/2, by, true);
}

function drawPipeLeaves(cx, cy, flipped) {
  const dir = flipped ? 1 : -1;
  ctx.fillStyle = '#228838';
  for (let i = -1; i <= 1; i++) {
    ctx.beginPath();
    ctx.ellipse(cx + i * 14*WSCALE, cy + dir * 10*WSCALE, 7*WSCALE, 12*WSCALE, i * .4, 0, Math.PI*2);
    ctx.fill();
  }
  // Lighter vein on each leaf
  ctx.fillStyle = '#44AA55';
  for (let i = -1; i <= 1; i++) {
    ctx.beginPath();
    ctx.ellipse(cx + i * 14*WSCALE, cy + dir * 10*WSCALE, 3*WSCALE, 7*WSCALE, i * .4, 0, Math.PI*2);
    ctx.fill();
  }
}

// ─── GROUND ───────────────────────────────────────────────────────────────────

// Tall-grass layers are pre-rendered to strips once and scrolled with two
// drawImage calls per frame instead of ~60 bézier path fills
const GRASS_H = 34;
function makeGrassStrip(period, col, blades) {
  const c = document.createElement('canvas');
  c.width = (CW + period) * DPR; c.height = GRASS_H * DPR;
  const g = c.getContext('2d');
  g.setTransform(DPR, 0, 0, DPR, 0, 0);
  g.fillStyle = col;
  // overdraw one period either side so the sampling window never shows a seam
  for (let x = -period; x < CW + period * 2; x += period) blades(g, x, GRASS_H);
  return c;
}
const grassDark = makeGrassStrip(14, '#3A9818', (g, x, h) => {
  g.beginPath();
  g.moveTo(x, h);
  g.quadraticCurveTo(x - 7, h - 18, x - 4, h - 30);
  g.quadraticCurveTo(x + 2, h - 18, x + 5, h);
  g.fill();
  g.beginPath();
  g.moveTo(x + 7, h);
  g.quadraticCurveTo(x + 14, h - 15, x + 10, h - 26);
  g.quadraticCurveTo(x + 5, h - 15, x + 3, h);
  g.fill();
});
const grassLight = makeGrassStrip(18, '#58BC28', (g, x, h) => {
  g.beginPath();
  g.moveTo(x + 4, h);
  g.quadraticCurveTo(x - 3, h - 20, x, h - 32);
  g.quadraticCurveTo(x + 6, h - 20, x + 8, h);
  g.fill();
});

function drawGround() {
  const grassY = CH - GH;
  const dOff = (scrollX * 1.2) % 14;
  const lOff = (scrollX * .9) % 18;
  ctx.drawImage(grassDark,  dOff * DPR, 0, CW * DPR, GRASS_H * DPR, 0, grassY - GRASS_H, CW, GRASS_H);
  ctx.drawImage(grassLight, lOff * DPR, 0, CW * DPR, GRASS_H * DPR, 0, grassY - GRASS_H, CW, GRASS_H);

  // Dirt
  ctx.fillStyle = '#8B6914'; ctx.fillRect(0, grassY, CW, GH);
  // Grass strip
  ctx.fillStyle = '#4A8A20'; ctx.fillRect(0, grassY, CW, 14);
  // Ground tufts
  ctx.fillStyle = '#3A7A10';
  for (let x = groundX; x < CW + 40; x += 40) {
    ctx.beginPath(); ctx.arc(x, grassY+7, 11, Math.PI, 0); ctx.fill();
  }
  // Dirt texture
  ctx.fillStyle = '#7A5A0A';
  for (let x = groundX+2; x < CW + 40; x += 40) {
    ctx.fillRect(x, grassY+16, 20, 5);
    ctx.fillRect(x+22, grassY+26, 14, 4);
  }
}

// ─── POKÉMON CENTER ──────────────────────────────────────────────────────────

function drawPokeCenter(ctx, cx, baseY) {
  // cx / baseY are supplied by drawMountains so the building tracks the hill
  // crest at any field width.
  const bw = Math.min(100, CW * .30), bh = 62;
  const bx = cx - bw / 2;

  ctx.save();
  ctx.globalAlpha = 0.88;

  // Drop shadow
  ctx.fillStyle = 'rgba(0,0,0,.13)';
  ctx.fillRect(bx + 4, baseY - 2, bw, 6);

  // Main walls — white/off-white
  ctx.fillStyle = '#F2F2FA';
  ctx.fillRect(bx, baseY - bh, bw, bh);

  // ── Dome arch roof ──────────────────────────────────────────
  const roofBot = baseY - bh;      // top of walls = bottom of roof
  const domeH   = 38;
  ctx.fillStyle = '#CC2222';
  ctx.beginPath();
  ctx.moveTo(bx - 5, roofBot + 3);
  ctx.bezierCurveTo(bx - 5, roofBot - domeH + 8, cx - 22, roofBot - domeH - 4, cx, roofBot - domeH);
  ctx.bezierCurveTo(cx + 22, roofBot - domeH - 4, bx + bw + 5, roofBot - domeH + 8, bx + bw + 5, roofBot + 3);
  ctx.closePath(); ctx.fill();

  // Roof eave (darker trim at the bottom edge of the dome)
  ctx.fillStyle = '#AA1818';
  ctx.fillRect(bx - 6, roofBot - 2, bw + 12, 6);

  // ── Pink dome / finial at peak ────────────────────────────────
  const peakY = roofBot - domeH;
  ctx.fillStyle = '#FF9999';
  ctx.beginPath(); ctx.arc(cx, peakY, 9, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#FFBBBB';
  ctx.beginPath(); ctx.arc(cx - 2.5, peakY - 2.5, 4.5, 0, Math.PI * 2); ctx.fill();

  // ── Poké Ball on the front dome face ─────────────────────────
  const pbX = cx, pbY = roofBot - domeH / 2 - 2;
  const pbR = 12;
  // Red half
  ctx.fillStyle = '#CC2222';
  ctx.beginPath(); ctx.arc(pbX, pbY, pbR, Math.PI, 0); ctx.fill();
  // White half
  ctx.fillStyle = '#F8F8F8';
  ctx.beginPath(); ctx.arc(pbX, pbY, pbR, 0, Math.PI); ctx.fill();
  // Black outline + midline
  ctx.strokeStyle = '#111'; ctx.lineWidth = 1.8;
  ctx.beginPath(); ctx.arc(pbX, pbY, pbR, 0, Math.PI * 2); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(pbX - pbR, pbY); ctx.lineTo(pbX + pbR, pbY); ctx.stroke();
  // Centre button
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(pbX, pbY, 4.5, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = '#111'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.arc(pbX, pbY, 4.5, 0, Math.PI * 2); ctx.stroke();

  // ── Windows ──────────────────────────────────────────────────
  ctx.fillStyle = 'rgba(160,215,245,.78)';
  ctx.fillRect(bx + 7, baseY - bh + 9, 18, 14);
  ctx.fillRect(bx + bw - 25, baseY - bh + 9, 18, 14);
  ctx.strokeStyle = 'rgba(100,160,210,.88)'; ctx.lineWidth = 1;
  ctx.strokeRect(bx + 7, baseY - bh + 9, 18, 14);
  ctx.strokeRect(bx + bw - 25, baseY - bh + 9, 18, 14);
  // Window sash lines
  ctx.beginPath();
  ctx.moveTo(bx + 16, baseY - bh + 9); ctx.lineTo(bx + 16, baseY - bh + 23);
  ctx.moveTo(bx + bw - 16, baseY - bh + 9); ctx.lineTo(bx + bw - 16, baseY - bh + 23);
  ctx.stroke();

  // ── Double door ───────────────────────────────────────────────
  ctx.fillStyle = 'rgba(130,198,242,.85)';
  ctx.fillRect(cx - 10, baseY - 22, 20, 22);
  ctx.strokeStyle = 'rgba(80,145,198,.9)'; ctx.lineWidth = 1;
  ctx.strokeRect(cx - 10, baseY - 22, 20, 22);
  ctx.beginPath(); ctx.moveTo(cx, baseY - 22); ctx.lineTo(cx, baseY); ctx.stroke();

  // ── Red cross above door (classic Pokémon Center symbol) ────────
  const crossX = cx, crossY = baseY - bh + 42;
  ctx.fillStyle = '#CC2222';
  ctx.fillRect(crossX - 3, crossY - 9, 6, 18);   // vertical bar
  ctx.fillRect(crossX - 9, crossY - 3, 18, 6);   // horizontal bar

  // Wall outline
  ctx.strokeStyle = 'rgba(170,165,195,.35)'; ctx.lineWidth = 1;
  ctx.strokeRect(bx, baseY - bh, bw, bh);

  ctx.restore();
}

// ─── WILD ODDISH ─────────────────────────────────────────────────────────────

function drawOddish(ctx, ox, oy) {
  // oy = ground line; body and leaves peek above it
  ctx.save();
  ctx.globalAlpha = 0.76;
  const r = 10;

  // Leaves behind body
  ctx.fillStyle = '#3A9030';
  ctx.beginPath(); ctx.ellipse(ox,     oy - r * 2.5, 3.5, 9,    0,    0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(ox - 7, oy - r * 2.0, 3,   8, -0.5,   0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(ox + 7, oy - r * 2.0, 3,   8,  0.5,   0, Math.PI * 2); ctx.fill();

  // Round body
  ctx.fillStyle = '#4858A8';
  ctx.beginPath(); ctx.arc(ox, oy - r, r, 0, Math.PI * 2); ctx.fill();

  // Eyes
  ctx.fillStyle = '#FFFFFF';
  ctx.beginPath(); ctx.arc(ox - 3.5, oy - r - 1, 3, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(ox + 3.5, oy - r - 1, 3, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#202038';
  ctx.beginPath(); ctx.arc(ox - 3.5, oy - r - 1, 1.5, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(ox + 3.5, oy - r - 1, 1.5, 0, Math.PI * 2); ctx.fill();

  ctx.restore();
}

// ─── DIGLETT ─────────────────────────────────────────────────────────────────

function drawDiglett(ctx, x, groundY) {
  // groundY = ground line; Diglett pokes head out of a rocky dirt mound
  ctx.save();
  ctx.globalAlpha = 0.80;

  // Soil mound (rocky dirt pile around the hole)
  ctx.fillStyle = '#9A7040';
  ctx.beginPath(); ctx.ellipse(x, groundY + 2, 20, 9, 0, Math.PI, 0); ctx.fill();
  // Stone highlights on the mound
  ctx.fillStyle = '#7A5830';
  ctx.beginPath(); ctx.ellipse(x - 10, groundY - 2, 6, 3.5, -0.3, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(x + 9, groundY - 1, 5, 3, 0.25, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#C49858';
  ctx.beginPath(); ctx.ellipse(x + 1, groundY - 4, 4, 2.5, -0.1, 0, Math.PI * 2); ctx.fill();

  // Head — warm brown rounded dome
  ctx.fillStyle = '#C07858';
  ctx.beginPath(); ctx.arc(x, groundY - 12, 11, 0, Math.PI * 2); ctx.fill();
  // Shading on head
  ctx.fillStyle = '#A86040';
  ctx.beginPath(); ctx.arc(x + 3, groundY - 10, 9, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#C07858';
  ctx.beginPath(); ctx.arc(x, groundY - 13, 8, 0, Math.PI * 2); ctx.fill();

  // Big oval pink nose (most distinctive Diglett feature)
  ctx.fillStyle = '#F07870';
  ctx.beginPath(); ctx.ellipse(x, groundY - 11, 5, 4, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#FFAAAA';
  ctx.beginPath(); ctx.ellipse(x - 1.5, groundY - 12.5, 2.5, 1.8, -0.3, 0, Math.PI * 2); ctx.fill();

  // Beady dot eyes
  ctx.fillStyle = '#111111';
  ctx.beginPath(); ctx.arc(x - 4, groundY - 16, 2, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(x + 4, groundY - 16, 2, 0, Math.PI * 2); ctx.fill();
  // White glint
  ctx.fillStyle = '#FFFFFF';
  ctx.beginPath(); ctx.arc(x - 3.2, groundY - 16.8, 0.8, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(x + 4.8, groundY - 16.8, 0.8, 0, Math.PI * 2); ctx.fill();

  ctx.restore();
}

// ─── BACKGROUND BUTTERFREE ───────────────────────────────────────────────────

function drawBgButterfree(x, y) {
  ctx.save();
  ctx.globalAlpha = 0.58;
  const t = Date.now() * 0.009;
  // Wings beat: upper rise, lower drop on opposite phase
  const liftU = Math.sin(t) * 11;
  const liftD = Math.cos(t) * 5;

  // ── Upper wings (white + black border + black spot) ────────────
  function upperWing(side) {
    const s = side; // +1 right, -1 left
    ctx.fillStyle = '#F4F4F0';
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.bezierCurveTo(x + s * 7, y - 6 - liftU, x + s * 24, y - 16 - liftU, x + s * 27, y - 4);
    ctx.bezierCurveTo(x + s * 22, y + 5, x + s * 10, y + 7, x, y);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = '#1a1818'; ctx.lineWidth = 1.4;
    ctx.stroke();
    // Black oval spot on upper wing
    ctx.fillStyle = '#1a1818';
    ctx.beginPath(); ctx.ellipse(x + s * 16, y - 10 - liftU * 0.5, 3.5, 2.5, s * 0.4, 0, Math.PI * 2); ctx.fill();
  }
  upperWing(1); upperWing(-1);

  // ── Lower wings (white + black border, wider/rounder) ──────────
  function lowerWing(side) {
    const s = side;
    ctx.fillStyle = '#F4F4F0';
    ctx.beginPath();
    ctx.moveTo(x + s * 2, y + 4);
    ctx.bezierCurveTo(x + s * 10, y + 3 + liftD, x + s * 21, y + 7 + liftD, x + s * 21, y + 18);
    ctx.bezierCurveTo(x + s * 14, y + 22, x + s * 5, y + 16, x + s * 2, y + 8);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = '#1a1818'; ctx.lineWidth = 1.4;
    ctx.stroke();
    // Small oval spot on lower wing
    ctx.fillStyle = '#1a1818';
    ctx.beginPath(); ctx.ellipse(x + s * 14, y + 14 + liftD * 0.4, 2.8, 2, 0, 0, Math.PI * 2); ctx.fill();
  }
  lowerWing(1); lowerWing(-1);

  // ── Blue-teal body ────────────────────────────────────────────
  ctx.fillStyle = '#3A7A9A';
  ctx.beginPath(); ctx.ellipse(x, y + 6, 3.2, 9, 0, 0, Math.PI * 2); ctx.fill();

  // ── Head (darker teal) ────────────────────────────────────────
  ctx.fillStyle = '#2E6880';
  ctx.beginPath(); ctx.arc(x, y - 1, 4.5, 0, Math.PI * 2); ctx.fill();

  // ── Large compound eyes (prominent red) ───────────────────────
  ctx.fillStyle = '#CC1818';
  ctx.beginPath(); ctx.arc(x - 5, y - 2, 4.2, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(x + 5, y - 2, 4.2, 0, Math.PI * 2); ctx.fill();
  // Eye sheen
  ctx.fillStyle = '#FF4444';
  ctx.beginPath(); ctx.arc(x - 6, y - 3.5, 1.8, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(x + 4, y - 3.5, 1.8, 0, Math.PI * 2); ctx.fill();
  // Pupils
  ctx.fillStyle = '#220000';
  ctx.beginPath(); ctx.arc(x - 4.5, y - 1.5, 1.5, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(x + 5.5, y - 1.5, 1.5, 0, Math.PI * 2); ctx.fill();

  // ── Antennae (black, curving outward, ball tips) ───────────────
  ctx.strokeStyle = '#1a1818'; ctx.lineWidth = 1.5; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(x - 2, y - 4); ctx.quadraticCurveTo(x - 7, y - 11, x - 10, y - 15); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x + 2, y - 4); ctx.quadraticCurveTo(x + 7, y - 11, x + 10, y - 15); ctx.stroke();
  ctx.fillStyle = '#1a1818';
  ctx.beginPath(); ctx.arc(x - 10, y - 15, 2.2, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(x + 10, y - 15, 2.2, 0, Math.PI * 2); ctx.fill();

  ctx.restore();
}

// ─── HUD ─────────────────────────────────────────────────────────────────────

const FONT = "'Trebuchet MS','Segoe UI',Verdana,sans-serif";

// Flappy Bird's score is a bare outlined numeral high on the screen — no
// plaque, no chrome. Reads instantly and never covers the play field.
function drawScoreHUD() {
  ctx.save();
  ctx.translate(CW / 2, 62);
  const pop = 1 + scorePop * .28;
  ctx.scale(pop, pop);
  ctx.font = '900 46px ' + FONT;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.lineJoin = 'round';
  ctx.strokeStyle = 'rgba(0,0,0,.85)'; ctx.lineWidth = 7;
  ctx.strokeText(String(score), 0, 0);
  ctx.fillStyle = '#fff';
  ctx.fillText(String(score), 0, 0);
  ctx.restore();
}

// Mid-run celebration text (currently: beating your record)
function drawBanner() {
  const t = banner;
  const rise = (1 - t) * 26;
  ctx.save();
  ctx.globalAlpha = Math.min(1, t * 2.4);
  ctx.translate(CW / 2, CH * .30 - rise);
  const s = 1 + Math.max(0, t - .8) * 1.6;
  ctx.scale(s, s);
  ctx.font = '900 30px ' + FONT;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.lineJoin = 'round';
  ctx.strokeStyle = 'rgba(90,50,0,.9)'; ctx.lineWidth = 7;
  ctx.strokeText(bannerText, 0, 0);
  ctx.fillStyle = '#FFD700';
  ctx.fillText(bannerText, 0, 0);
  ctx.restore();
}

// The "Get Ready" card, straight out of Flappy Bird — title plus a hand
// that taps in rhythm so the single-input rule needs no words.
function drawTapHint() {
  const t = Date.now() * .004;
  ctx.save();
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';

  ctx.font = '900 34px ' + FONT;
  ctx.lineJoin = 'round';
  ctx.strokeStyle = 'rgba(0,0,0,.8)'; ctx.lineWidth = 7;
  ctx.strokeText('GET READY!', CW / 2, CH * .30);
  ctx.fillStyle = '#fff';
  ctx.fillText('GET READY!', CW / 2, CH * .30);

  // Tapping hand — bobs toward the screen on the beat
  const bob = Math.max(0, Math.sin(t)) * 7;
  drawTapHand(CW / 2, CH * .60 + bob);

  // Hint sits on a dark pill so it stays legible over sky, hill or grass
  const hint = 'Tap to flap', hy = CH * .60 + 54;
  ctx.font = '800 16px ' + FONT;
  const pw = ctx.measureText(hint).width + 26;
  ctx.globalAlpha = .8 + .2 * Math.sin(t);
  ctx.fillStyle = 'rgba(0,0,0,.5)';
  roundRect(ctx, CW / 2 - pw / 2, hy - 14, pw, 28, 14); ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.fillText(hint, CW / 2, hy);
  ctx.restore();
}

// A tapping hand: fist with the index finger extended up-left and a clearly
// separate thumb, tilted off-vertical. The thumb and folded knuckles are what
// make it read unambiguously as a pointing hand.
function drawTapHand(x, y) {
  ctx.save();
  ctx.translate(x, y);

  // Ripple pulsing out from the fingertip
  const p = (Date.now() % 900) / 900;
  ctx.strokeStyle = 'rgba(255,255,255,' + (0.55 * (1 - p)).toFixed(2) + ')';
  ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.arc(-5, -20, 5 + p * 18, 0, Math.PI * 2); ctx.stroke();

  ctx.rotate(-0.18);
  ctx.fillStyle = '#FFE0BD';
  ctx.strokeStyle = 'rgba(90,55,25,.75)';
  ctx.lineWidth = 2; ctx.lineJoin = 'round'; ctx.lineCap = 'round';

  // Fist
  ctx.beginPath();
  ctx.moveTo(-10, 0);
  ctx.quadraticCurveTo(-13, 16, -2, 20);
  ctx.quadraticCurveTo(11, 21, 13, 8);
  ctx.quadraticCurveTo(14, -1, 6, -2);
  ctx.quadraticCurveTo(-2, -3, -10, 0);
  ctx.closePath();
  ctx.fill(); ctx.stroke();

  // Index finger, extended up and offset to the left of centre
  ctx.beginPath();
  ctx.moveTo(-9, 1);
  ctx.lineTo(-8, -17);
  ctx.quadraticCurveTo(-7.5, -24, -2.5, -24);
  ctx.quadraticCurveTo(2, -24, 2, -17);
  ctx.lineTo(2, 2);
  ctx.closePath();
  ctx.fill(); ctx.stroke();

  // Thumb tucked across the front — the key silhouette cue
  ctx.beginPath();
  ctx.moveTo(-10, 6);
  ctx.quadraticCurveTo(-17, 8, -15, 14);
  ctx.quadraticCurveTo(-13, 19, -5, 17);
  ctx.stroke();

  // Folded knuckles on the right edge
  ctx.lineWidth = 1.6;
  ctx.strokeStyle = 'rgba(90,55,25,.45)';
  for (let i = 0; i < 3; i++) {
    ctx.beginPath();
    ctx.arc(6.5, 3 + i * 5.5, 4.5, -Math.PI * .55, Math.PI * .42);
    ctx.stroke();
  }
  ctx.restore();
}

// ─── MEDALS ──────────────────────────────────────────────────────────────────
// Bronze / silver / gold / platinum, each with a Poké Ball struck into the
// face — the Flappy Bird medal shape wearing the Pokémon motif.
const MEDALS = [
  { name:'Bronze',   rim:'#A05A2C', face:'#D08040', hi:'#F0A868' },
  { name:'Silver',   rim:'#8A8A96', face:'#C4C4D0', hi:'#EDEDF4' },
  { name:'Gold',     rim:'#B8901E', face:'#F0C230', hi:'#FFE882' },
  { name:'Platinum', rim:'#4E8FA8', face:'#8FD4E8', hi:'#D4F4FF' },
];

function drawMedal(cv, tier) {
  const m = MEDALS[tier] || MEDALS[0];
  const S = 76, c = S / 2;
  const bs = Math.min(window.devicePixelRatio || 1, 2);
  cv.width = S * bs; cv.height = S * bs;
  const g = cv.getContext('2d');
  g.setTransform(bs, 0, 0, bs, 0, 0);
  g.clearRect(0, 0, S, S);

  // Ribbon tails behind the disc
  g.fillStyle = '#3B6FCA';
  g.beginPath(); g.moveTo(c - 14, 8); g.lineTo(c - 3, 8); g.lineTo(c - 8, 30); g.lineTo(c - 20, 26); g.closePath(); g.fill();
  g.fillStyle = '#2F58A4';
  g.beginPath(); g.moveTo(c + 14, 8); g.lineTo(c + 3, 8); g.lineTo(c + 8, 30); g.lineTo(c + 20, 26); g.closePath(); g.fill();

  // Outer rim
  g.fillStyle = m.rim;
  g.beginPath(); g.arc(c, c + 8, 26, 0, Math.PI * 2); g.fill();
  // Face
  g.fillStyle = m.face;
  g.beginPath(); g.arc(c, c + 8, 21, 0, Math.PI * 2); g.fill();
  // Top-left sheen
  g.fillStyle = m.hi; g.globalAlpha = .55;
  g.beginPath(); g.arc(c - 6, c + 2, 13, 0, Math.PI * 2); g.fill();
  g.globalAlpha = 1;

  // Poké Ball struck into the medal face
  const r = 11, by = c + 8;
  g.fillStyle = '#D83A3A';
  g.beginPath(); g.arc(c, by, r, Math.PI, 0); g.fill();
  g.fillStyle = '#F6F6F6';
  g.beginPath(); g.arc(c, by, r, 0, Math.PI); g.fill();
  g.strokeStyle = 'rgba(30,20,10,.8)'; g.lineWidth = 1.8;
  g.beginPath(); g.arc(c, by, r, 0, Math.PI * 2); g.stroke();
  g.beginPath(); g.moveTo(c - r, by); g.lineTo(c + r, by); g.stroke();
  g.fillStyle = '#fff';
  g.beginPath(); g.arc(c, by, 3.8, 0, Math.PI * 2); g.fill();
  g.strokeStyle = 'rgba(30,20,10,.8)'; g.lineWidth = 1.5;
  g.beginPath(); g.arc(c, by, 3.8, 0, Math.PI * 2); g.stroke();

  // Rim highlight
  g.strokeStyle = 'rgba(255,255,255,.5)'; g.lineWidth = 1.5;
  g.beginPath(); g.arc(c, c + 8, 26, Math.PI * 1.05, Math.PI * 1.75); g.stroke();
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x+r, y); ctx.lineTo(x+w-r, y); ctx.arcTo(x+w,y, x+w,y+r, r);
  ctx.lineTo(x+w, y+h-r); ctx.arcTo(x+w,y+h, x+w-r,y+h, r);
  ctx.lineTo(x+r, y+h); ctx.arcTo(x,y+h, x,y+h-r, r);
  ctx.lineTo(x, y+r); ctx.arcTo(x,y, x+r,y, r);
  ctx.closePath();
}

// ─── SCREENS ─────────────────────────────────────────────────────────────────

function showScreen(name) {
  curScreen = name;
  document.getElementById('s-start').classList.add('hide');
  document.getElementById('s-select').classList.add('hide');
  document.getElementById('s-gameover').classList.add('hide');
  if (name === 'start') {
    document.getElementById('start-best').textContent = 'Best: ' + bestScore;
    document.getElementById('s-start').classList.remove('hide');
  }
  if (name === 'select')   document.getElementById('s-select').classList.remove('hide');
  if (name === 'gameover') document.getElementById('s-gameover').classList.remove('hide');
}

function startGame() { resetGame(); showScreen('game'); }

// ─── CHARACTER SELECT UI ──────────────────────────────────────────────────────

// Gen-1 National Dex numbers and primary types — the details that make the
// select screen read as a Pokédex rather than a generic character grid.
const DEX = {
  bulbasaur:  { no:  1, type:'Grass',    tc:'#78C850' },
  charmander: { no:  4, type:'Fire',     tc:'#F08030' },
  charizard:  { no:  6, type:'Fire',     tc:'#F08030' },
  squirtle:   { no:  7, type:'Water',    tc:'#6890F0' },
  pidgey:     { no: 16, type:'Normal',   tc:'#A8A878' },
  pikachu:    { no: 25, type:'Electric', tc:'#F8D030' },
  magikarp:   { no:129, type:'Water',    tc:'#6890F0' },
  dragonite:  { no:149, type:'Dragon',   tc:'#7038F8' },
};

function buildCharGrid() {
  const grid = document.getElementById('char-grid');
  grid.innerHTML = '';
  CHARS.forEach(ch => {
    const dex = DEX[ch.id] || { no: 0, type: '???', tc: '#999' };
    const card = document.createElement('div');
    card.className = 'cc' + (ch.id === selectedChar.id ? ' sel' : '');

    const no = document.createElement('i');
    no.className = 'dexno';
    no.textContent = '#' + String(dex.no).padStart(3, '0');

    const mc = document.createElement('canvas');
    mc.width = 56 * DPR; mc.height = 56 * DPR;
    mc.style.width = '56px'; mc.style.height = '56px';
    const mctx = mc.getContext('2d');
    mctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    mctx.fillStyle = ch.col + '28';
    mctx.beginPath(); mctx.arc(28,28,25,0,Math.PI*2); mctx.fill();
    ch.draw(mctx, 28, 28, 46, 0);

    const lbl = document.createElement('span');
    lbl.textContent = ch.name;

    const type = document.createElement('em');
    type.className = 'dextype';
    type.textContent = dex.type;
    type.style.background = dex.tc;

    card.append(no, mc, lbl, type);
    card.addEventListener('click', () => {
      document.querySelectorAll('.cc').forEach(c => c.classList.remove('sel'));
      card.classList.add('sel');
      selectedChar = CHARS.find(c => c.id === ch.id);
      SFX.flap();
    });
    grid.appendChild(card);
  });
}

// ─── PREVIEW ─────────────────────────────────────────────────────────────────

const pCanvas = document.getElementById('preview-canvas');
pCanvas.width = 80 * DPR; pCanvas.height = 80 * DPR;
pCanvas.style.width = '80px'; pCanvas.style.height = '80px';
const pCtx = pCanvas.getContext('2d');
pCtx.setTransform(DPR, 0, 0, DPR, 0, 0);
const startScreenEl = document.getElementById('s-start');

function animPreview() {
  // only draw while the start screen is actually visible
  if (!startScreenEl.classList.contains('hide')) {
    pCtx.clearRect(0,0,80,80);
    pCtx.fillStyle = selectedChar.col + '28';
    pCtx.beginPath(); pCtx.arc(40,40,36,0,Math.PI*2); pCtx.fill();
    selectedChar.draw(pCtx, 40, 40, 64, Math.sin(Date.now()*.002)*.2);
  }
  requestAnimationFrame(animPreview);
}
animPreview();

// ─── EVENTS ──────────────────────────────────────────────────────────────────

document.addEventListener('keydown', e => {
  if (e.code === 'Space' || e.code === 'ArrowUp') {
    e.preventDefault();
    if (curScreen === 'game') flap();
    else if (curScreen === 'start' || curScreen === 'gameover') startGame();
  }
  if (e.code === 'Enter') {
    e.preventDefault();
    if (curScreen !== 'game') startGame();
  }
  if (e.code === 'KeyR' && curScreen === 'gameover') startGame();
  if (e.code === 'KeyP' && curScreen === 'game' && gamePhase === 'playing') paused = !paused;
});
canvas.addEventListener('click', flap);
canvas.addEventListener('touchstart', e => { e.preventDefault(); flap(); }, { passive:false });

const muteBtn = document.getElementById('btn-mute');
muteBtn.textContent = SFX.isMuted() ? '🔇' : '🔊';
muteBtn.addEventListener('click', e => {
  e.stopPropagation();
  muteBtn.textContent = SFX.toggle() ? '🔇' : '🔊';
  muteBtn.blur();
});

// Auto-pause if the tab/app goes to the background mid-run
document.addEventListener('visibilitychange', () => {
  if (document.hidden && curScreen === 'game' && gamePhase === 'playing') paused = true;
});

document.getElementById('btn-play').addEventListener('click', startGame);
document.getElementById('btn-to-sel').addEventListener('click', () => { buildCharGrid(); showScreen('select'); });
document.getElementById('btn-confirm').addEventListener('click', startGame);
document.getElementById('btn-back').addEventListener('click', () => showScreen('start'));
document.getElementById('btn-again').addEventListener('click', startGame);
document.getElementById('btn-change').addEventListener('click', () => { buildCharGrid(); showScreen('select'); });

// ─── LOOP ────────────────────────────────────────────────────────────────────

// Physics runs on a FIXED timestep. With a variable dt the same flap traces a
// different arc at 60Hz, 120Hz (ProMotion) and 144Hz. Quantising the simulation
// to 1/60s steps makes the game feel bit-identical on every display, while
// rendering still happens once per animation frame so it stays buttery.
const STEP = 1000 / 60;
let acc = 0, lastTs = 0;

function loop(ts) {
  let frameMs = ts - lastTs;
  lastTs = ts;
  // Tab was backgrounded / hitched — don't fast-forward the simulation
  if (frameMs > 250 || frameMs < 0) frameMs = STEP;
  acc += frameMs;

  let steps = 0;
  while (acc >= STEP && steps < 5) {
    if (!paused) update(1);      // dt is always exactly one logical frame
    acc -= STEP;
    steps++;
  }
  if (acc > STEP * 5) acc = 0;   // never let the accumulator run away

  render();
  requestAnimationFrame(loop);
}
showScreen('start');
requestAnimationFrame(ts => { lastTs = ts; requestAnimationFrame(loop); });
</script>
