<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0f1117">
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="Bench — a brick builder that snaps to real stud geometry, checks whether your model would stand up, and hands the result to the instruction compiler.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230f1117'/%3E%3Ccircle cx='16' cy='16' r='7' fill='%236c63ff'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/fonts/fonts.css">
<link rel="stylesheet" href="../system/system.css">
<title>Bench · Brick Lab</title>
<style>
html, body { height: 100%; overflow: hidden; }
body { display: flex; flex-direction: column; }

.bench { flex: 1; display: flex; min-height: 0; }

.tools {
  width: 268px; flex: none; overflow-y: auto; padding: .9rem;
  background: var(--surface-2); border-right: 1px solid var(--border);
  display: flex; flex-direction: column; gap: .9rem;
}
.tools section { display: flex; flex-direction: column; gap: .5rem; }

.part-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: .3rem; }
.part-btn {
  background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
  padding: 2px; cursor: pointer; line-height: 0; position: relative;
  transition: border-color .12s, background .12s;
}
.part-btn:hover { border-color: var(--accent-lt); }
.part-btn.on { border-color: var(--accent); background: rgba(108, 99, 255, .18); }
.part-btn canvas { width: 100%; height: 34px; display: block; }

.kindrow { display: flex; gap: .25rem; flex-wrap: wrap; }
.kindrow button {
  background: none; border: 1px solid var(--border); border-radius: 6px;
  color: var(--muted); font-size: .72rem; font-weight: 700; letter-spacing: .06em;
  text-transform: uppercase; padding: .22rem .45rem; cursor: pointer;
}
.kindrow button.on { border-color: var(--accent); color: var(--accent-lt); background: rgba(108,99,255,.14); }

.colour-grid { display: grid; grid-template-columns: repeat(9, 1fr); gap: .28rem; }
.colour-btn {
  aspect-ratio: 1; border-radius: 6px; cursor: pointer; padding: 0;
  border: 2px solid transparent; box-shadow: inset 0 0 0 1px rgba(255,255,255,.16);
}
.colour-btn.on { border-color: var(--accent-lt); }

.row { display: flex; gap: .35rem; flex-wrap: wrap; }
.row .btn { flex: 1; min-width: 0; }

.stage { flex: 1; min-width: 0; position: relative; }
.stage-hud {
  position: absolute; top: .7rem; left: .7rem; right: .7rem;
  display: flex; gap: .4rem; align-items: flex-start; flex-wrap: wrap;
  pointer-events: none;
}
.stage-hud > * { pointer-events: auto; }
.stage-hud .spacer { margin-left: auto; }

.readout {
  position: absolute; left: .7rem; bottom: .7rem;
  background: rgba(13, 15, 24, .86); border: 1px solid var(--border); border-radius: 9px;
  padding: .45rem .7rem; font-size: .78rem; color: var(--muted);
  display: flex; gap: .8rem; flex-wrap: wrap; max-width: calc(100% - 1.4rem);
}
.readout b { color: var(--text); font-weight: 600; }
.readout .bad { color: var(--warn); }

.saved-list { display: flex; flex-direction: column; gap: .25rem; max-height: 168px; overflow-y: auto; }
.saved-row {
  display: flex; align-items: center; gap: .4rem;
  background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: .3rem .5rem;
}
.saved-row span { flex: 1; font-size: .82rem; color: var(--text); overflow: hidden;
  text-overflow: ellipsis; white-space: nowrap; }
.saved-row button {
  background: none; border: none; color: var(--muted); cursor: pointer;
  font-size: .76rem; font-weight: 600; padding: .1rem .3rem;
}
.saved-row button:hover { color: var(--accent-lt); }
.saved-row button.del:hover { color: var(--hot); }

@media (max-width: 820px) {
  .bench { flex-direction: column; }
  .tools {
    width: 100%; border-right: none; border-top: 1px solid var(--border);
    order: 2; max-height: 46vh;
  }
  .stage { order: 1; min-height: 44vh; }
}
</style>
</head>
<body>

<a class="skip" href="#stage">Skip to the build area</a>

<header class="lab-head">
  <a class="lab-back" href="../">&larr; Brick&nbsp;Lab</a>
  <span class="lab-num">01</span>
  <span class="lab-title">Bench</span>
  <span class="lab-sub">Build it. Everything else reads from here.</span>
</header>

<div class="bench">

  <aside class="tools">
    <section>
      <div class="panel-title">Part</div>
      <div class="kindrow" id="kinds"></div>
      <div class="part-grid" id="parts"></div>
    </section>

    <section>
      <div class="panel-title">Colour</div>
      <div class="colour-grid" id="colours"></div>
    </section>

    <section>
      <div class="panel-title">Model</div>
      <input type="text" id="name" placeholder="Name this model" maxlength="40">
      <div class="row">
        <button class="btn small" id="save">Save</button>
        <button class="btn small" id="surprise">Surprise me</button>
      </div>
      <div class="row">
        <button class="btn small" id="share">Copy link</button>
        <button class="btn small danger" id="clear">Clear</button>
      </div>
      <button class="btn primary" id="toSteps">Compile instructions &rarr;</button>
      <div class="saved-list" id="saved"></div>
    </section>

    <section>
      <div class="panel-title">Keys</div>
      <p class="hint">
        <b>R</b> turn the part &middot; <b>[</b> <b>]</b> turn the view &middot;
        <b>D</b> delete tool &middot; <b>Ctrl+Z</b> undo
      </p>
    </section>
  </aside>

  <div class="stage" id="stage">
    <canvas id="cv"></canvas>

    <div class="stage-hud">
      <div class="seg" id="tool">
        <button data-tool="build" class="on">Build</button>
        <button data-tool="delete">Delete</button>
      </div>
      <button class="btn small" id="rotPart" title="Turn the part (R)">Turn part</button>
      <span class="spacer"></span>
      <button class="btn small" id="viewL" title="Turn the view left ([)">&#8630;</button>
      <button class="btn small" id="viewR" title="Turn the view right (])">&#8631;</button>
      <button class="btn small" id="fit" title="Frame the model">Fit</button>
      <button class="btn small" id="undo" title="Undo (Ctrl+Z)">Undo</button>
    </div>

    <div class="readout" id="readout"></div>
  </div>
</div>

<script src="../system/system.js"></script>
<script src="../system/iso.js"></script>
<script src="../system/steps.js"></script>
<script>
(function () {
  'use strict';

  var STORE = 'bricklab.bench.v1';

  var cv = document.getElementById('cv');
  var ctx = cv.getContext('2d');

  var model = newModel('Untitled');
  var view = { scale: 30, ox: 0, oy: 0 };
  var tool = 'build';
  var curPart = 'b2x4';
  var curColour = 'red';
  var curRot = 0;
  var kindFilter = 'brick';
  var hover = null;         /* candidate placement under the cursor */
  var hoverOk = false;
  var history = [];
  var dpr = 1;

  /* ── Framing ───────────────────────────────────────────────────────────── */

  function resize() {
    var r = cv.parentNode.getBoundingClientRect();
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    var w = Math.max(1, Math.round(r.width)), h = Math.max(1, Math.round(r.height));
    if (cv.width === w * dpr && cv.height === h * dpr) return false;
    cv.width = w * dpr; cv.height = h * dpr;
    return true;
  }

  function cssSize() {
    return { w: cv.width / dpr, h: cv.height / dpr };
  }

  function fitView() {
    var s = cssSize();
    var f = Iso.fit(model.parts.length ? model.parts : [place('b2x4', 'lgrey', 0, 0, 0, 0)],
      s.w, s.h, 54, 46);
    view.scale = Math.max(9, f.scale);
    view.ox = f.ox; view.oy = f.oy;
  }

  /* ── Drawing ───────────────────────────────────────────────────────────── */

  function draw() {
    resize();
    var s = cssSize();
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, s.w, s.h);

    Iso.grid(ctx, view, 14, 'rgba(255,255,255,0.055)');
    Iso.render(ctx, model.parts, view);

    if (hover && tool === 'build') {
      ctx.save();
      Iso.render(ctx, [hover], {
        scale: view.scale, ox: view.ox, oy: view.oy,
        ghost: new Set([0]),
        highlight: new Set([0]),
        outline: hoverOk ? 'rgba(168,157,255,.95)' : 'rgba(251,113,133,.95)',
      });
      ctx.restore();
    }

    updateReadout();
  }

  function updateReadout() {
    var el = document.getElementById('readout');
    var issues = model.parts.length ? validate(model.parts) : [];
    var floating = issues.filter(function (i) { return i.kind === 'floating'; }).length;
    var b = boundsOf(model.parts);
    var bits = [
      '<b>' + model.parts.length + '</b> parts',
      '<b>' + (b.x1 - b.x0) + '×' + (b.z1 - b.z0) + '</b> studs',
      '<b>' + (b.y1 - b.y0) + '</b> plates tall',
    ];
    if (floating) {
      bits.push('<span class="bad">' + floating + ' floating — it would fall apart</span>');
    } else if (model.parts.length) {
      bits.push('<span style="color:var(--ok)">holds together</span>');
    }
    el.innerHTML = bits.join('');
  }

  /* ── Placement ─────────────────────────────────────────────────────────── */

  function pointerCell(ev) {
    var r = cv.getBoundingClientRect();
    return { x: ev.clientX - r.left, y: ev.clientY - r.top };
  }

  /* Cast the view ray through the grid.
     A screen point does not name a cell — it names a line. Because (1,1,1) is
     the view direction, that line is exactly (X₀+t, t, Z₀+t) where X₀,Z₀ come
     from unprojecting at ground level. Marching t from near the camera to far
     and stopping at the first filled cell gives the surface you can actually
     see, and the empty cell just before it is the one you meant to fill.
     Cells are 1 stud wide and 0.4 tall, so a step of 0.08 cannot skip one. */
  function rayPick(px, py) {
    var p0 = Iso.unproject(px - view.ox, py - view.oy, 0, view.scale);
    if (!model.parts.length) return null;

    var b = boundsOf(model.parts);
    var occ = occupancy(model.parts);
    var tLo = Math.max(0, b.x0 - p0.x, b.z0 - p0.z);
    var tHi = Math.min(b.y1 * PLATE_U, b.x1 - p0.x, b.z1 - p0.z);
    if (tHi <= tLo) return null;                    /* the ray misses entirely */

    var free = null;
    for (var t = tHi + 0.5; t >= tLo; t -= 0.08) {
      var cell = {
        x: Math.floor(p0.x + t),
        y: Math.floor(t / PLATE_U),
        z: Math.floor(p0.z + t),
      };
      var k = cell.x + ',' + cell.y + ',' + cell.z;
      if (occ.has(k)) return { index: occ.get(k), free: free };
      free = cell;
    }
    return null;
  }

  /* Turn a screen point into a legal placement.
     The cell the ray gives you is where the surface is; the part then falls to
     the lowest level at or below it that will actually hold. Click the top of
     a brick and it lands on top; click the side of a wall and it drops to the
     floor beside it, which is what a hand would do. */
  function candidateAt(px, py) {
    var hit = rayPick(px, py);
    var cell;
    if (hit && hit.free) {
      cell = hit.free;
    } else {
      var p0 = Iso.unproject(px - view.ox, py - view.oy, 0, view.scale);
      cell = { x: Math.floor(p0.x), y: 0, z: Math.floor(p0.z) };
    }

    var best = null;
    for (var y = cell.y; y >= 0; y--) {
      var cand = place(curPart, curColour, cell.x, y, cell.z, curRot);
      if (!best) best = cand;
      if (legal(cand)) return { pl: cand, ok: true };
    }
    return { pl: best, ok: false };
  }

  function legal(cand) {
    if (cand.y < 0) return false;
    if (collides(model.parts, cand, -1)) return false;
    if (cand.y === 0) return true;
    var trial = model.parts.concat([cand]);
    return supportersOf(trial, trial.length - 1).length > 0;
  }

  function push() {
    history.push(encode(model));
    if (history.length > 60) history.shift();
  }

  function addAt(px, py) {
    var c = candidateAt(px, py);
    if (!c.ok) return;
    push();
    model.parts.push(c.pl);
    changed();
  }

  function deleteAt(px, py) {
    var hit = rayPick(px, py);
    if (!hit) return;
    push();
    model.parts.splice(hit.index, 1);
    changed();
  }

  function changed() {
    persist();
    draw();
  }

  /* ── Pointer ───────────────────────────────────────────────────────────── */

  var dragging = false, dragged = false, last = null, hoverKey = '';

  cv.addEventListener('pointerdown', function (ev) {
    cv.setPointerCapture(ev.pointerId);
    dragging = true; dragged = false;
    last = pointerCell(ev);
  });

  cv.addEventListener('pointermove', function (ev) {
    var p = pointerCell(ev);
    if (dragging) {
      var dx = p.x - last.x, dy = p.y - last.y;
      if (Math.abs(dx) + Math.abs(dy) > 3) dragged = true;
      if (dragged) {                                   /* pan the view */
        view.ox += dx; view.oy += dy;
        last = p; hover = null;
        draw();
      }
      return;
    }
    if (tool !== 'build') { if (hover) { hover = null; draw(); } return; }
    var c = candidateAt(p.x, p.y);
    var key = c.pl ? encodePlacement(c.pl) + c.ok : '';
    if (key !== hoverKey) { hoverKey = key; hover = c.pl; hoverOk = c.ok; draw(); }
  });

  function encodePlacement(p) { return [p.part, p.c, p.x, p.y, p.z, p.r].join(','); }

  cv.addEventListener('pointerup', function (ev) {
    dragging = false;
    var p = pointerCell(ev);
    if (dragged) { dragged = false; return; }
    if (tool === 'build') addAt(p.x, p.y); else deleteAt(p.x, p.y);
  });

  cv.addEventListener('pointerleave', function () {
    if (hover) { hover = null; hoverKey = ''; draw(); }
  });

  cv.addEventListener('wheel', function (ev) {
    ev.preventDefault();
    var s = cssSize();
    var cx = s.w / 2, cy = s.h / 2;
    var f = ev.deltaY < 0 ? 1.12 : 1 / 1.12;
    var ns = Math.max(9, Math.min(90, view.scale * f));
    /* Zoom about the middle of the stage. */
    view.ox = cx - (cx - view.ox) * (ns / view.scale);
    view.oy = cy - (cy - view.oy) * (ns / view.scale);
    view.scale = ns;
    draw();
  }, { passive: false });

  /* ── Palettes ──────────────────────────────────────────────────────────── */

  var KINDS = [
    { id: 'brick', label: 'Bricks' },
    { id: 'plate', label: 'Plates' },
    { id: 'tile', label: 'Tiles' },
    { id: 'slope', label: 'Slopes' },
    { id: 'round', label: 'Round' },
  ];

  function buildKinds() {
    var host = document.getElementById('kinds');
    host.innerHTML = '';
    KINDS.forEach(function (k) {
      var b = document.createElement('button');
      b.textContent = k.label;
      b.className = k.id === kindFilter ? 'on' : '';
      b.addEventListener('click', function () { kindFilter = k.id; buildKinds(); buildParts(); });
      host.appendChild(b);
    });
  }

  function drawIcon(canvas, partId) {
    var c = canvas.getContext('2d');
    var d = Math.min(window.devicePixelRatio || 1, 2);
    var w = canvas.clientWidth || 52, h = 34;
    canvas.width = w * d; canvas.height = h * d;
    c.setTransform(d, 0, 0, d, 0, 0);
    c.clearRect(0, 0, w, h);
    var one = [place(partId, curColour, 0, 0, 0, 0)];
    var f = Iso.fit(one, w, h, 4, 13);
    Iso.render(c, one, f);
  }

  function buildParts() {
    var host = document.getElementById('parts');
    host.innerHTML = '';
    PARTS.filter(function (p) { return p.kind === kindFilter; }).forEach(function (p) {
      var b = document.createElement('button');
      b.className = 'part-btn' + (p.id === curPart ? ' on' : '');
      b.title = p.name;
      b.setAttribute('aria-label', p.name);
      var c = document.createElement('canvas');
      b.appendChild(c);
      b.addEventListener('click', function () { curPart = p.id; buildParts(); });
      host.appendChild(b);
      requestAnimationFrame(function () { drawIcon(c, p.id); });
    });
  }

  function buildColours() {
    var host = document.getElementById('colours');
    host.innerHTML = '';
    COLOURS.forEach(function (col) {
      var b = document.createElement('button');
      b.className = 'colour-btn' + (col.id === curColour ? ' on' : '');
      b.style.background = col.hex;
      b.title = col.name;
      b.setAttribute('aria-label', col.name);
      b.addEventListener('click', function () { curColour = col.id; buildColours(); buildParts(); });
      host.appendChild(b);
    });
  }

  /* ── Saved models ──────────────────────────────────────────────────────── */

  function readStore() {
    try { return JSON.parse(localStorage.getItem(STORE) || '{}') || {}; }
    catch (e) { return {}; }
  }
  function writeStore(o) {
    try { localStorage.setItem(STORE, JSON.stringify(o)); } catch (e) { /* private mode */ }
  }
  function persist() {
    var s = readStore();
    s.current = encode(model);
    writeStore(s);
  }

  function renderSaved() {
    var s = readStore();
    var host = document.getElementById('saved');
    host.innerHTML = '';
    var names = Object.keys(s.models || {});
    names.forEach(function (n) {
      var row = document.createElement('div');
      row.className = 'saved-row';
      var label = document.createElement('span');
      label.textContent = n;
      var open = document.createElement('button');
      open.textContent = 'Open';
      open.addEventListener('click', function () {
        push();
        model = decode(s.models[n]);
        document.getElementById('name').value = model.name;
        fitView(); changed();
      });
      var del = document.createElement('button');
      del.className = 'del'; del.textContent = 'Delete';
      del.setAttribute('aria-label', 'Delete ' + n);
      del.addEventListener('click', function () {
        var cur = readStore();
        delete cur.models[n];
        writeStore(cur); renderSaved();
      });
      row.appendChild(label); row.appendChild(open); row.appendChild(del);
      host.appendChild(row);
    });
  }

  /* ── Buttons ───────────────────────────────────────────────────────────── */

  document.getElementById('tool').addEventListener('click', function (ev) {
    var b = ev.target.closest('button'); if (!b) return;
    tool = b.getAttribute('data-tool');
    Array.prototype.forEach.call(this.children, function (c) { c.classList.toggle('on', c === b); });
    hover = null; hoverKey = ''; draw();
  });

  document.getElementById('rotPart').addEventListener('click', function () {
    curRot = (curRot + 1) % 4; hoverKey = ''; draw();
  });

  function turnView(k) {
    push();
    model.parts = rotateParts(model.parts, k);
    fitView(); changed();
  }
  document.getElementById('viewL').addEventListener('click', function () { turnView(3); });
  document.getElementById('viewR').addEventListener('click', function () { turnView(1); });
  document.getElementById('fit').addEventListener('click', function () { fitView(); draw(); });

  document.getElementById('undo').addEventListener('click', undo);
  function undo() {
    if (!history.length) return;
    model = decode(history.pop());
    document.getElementById('name').value = model.name;
    changed();
  }

  document.getElementById('clear').addEventListener('click', function () {
    if (model.parts.length && !confirm('Clear the whole model?')) return;
    push();
    model.parts = [];
    changed();
  });

  document.getElementById('surprise').addEventListener('click', function () {
    push();
    model = generate({
      count: 12 + Math.floor(Math.random() * 8),
      parts: ['b1x1', 'b1x2', 'b1x4', 'b2x2', 'b2x3', 'b2x4', 'p1x2', 'p2x4', 's2x1', 's2x2', 't1x2', 'r1x1'],
      colours: ['red', 'blue', 'yellow', 'white', 'green', 'orange', 'lgrey', 'tan'],
      name: 'Surprise',
    });
    document.getElementById('name').value = model.name;
    fitView(); changed();
  });

  document.getElementById('name').addEventListener('input', function () {
    model.name = this.value || 'Untitled';
    persist();
  });

  document.getElementById('save').addEventListener('click', function () {
    var n = (document.getElementById('name').value || '').trim();
    if (!n) { document.getElementById('name').focus(); return; }
    var s = readStore();
    s.models = s.models || {};
    model.name = n;
    s.models[n] = encode(model);
    writeStore(s); renderSaved();
    flash(this, 'Saved');
  });

  document.getElementById('share').addEventListener('click', function () {
    var url = location.origin + location.pathname + '#' + encodeURIComponent(encode(model));
    var btn = this;
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(url).then(
        function () { flash(btn, 'Copied'); },
        function () { location.hash = encodeURIComponent(encode(model)); flash(btn, 'In the bar'); }
      );
    } else {
      location.hash = encodeURIComponent(encode(model));
      flash(btn, 'In the bar');
    }
  });

  document.getElementById('toSteps').addEventListener('click', function () {
    location.href = '../c2-steps/#' + encodeURIComponent(encode(model));
  });

  function flash(btn, msg) {
    var old = btn.textContent;
    btn.textContent = msg;
    setTimeout(function () { btn.textContent = old; }, 1100);
  }

  document.addEventListener('keydown', function (ev) {
    if (ev.target.tagName === 'INPUT') return;
    var k = ev.key.toLowerCase();
    if (k === 'r') { curRot = (curRot + 1) % 4; hoverKey = ''; draw(); }
    else if (k === '[') turnView(3);
    else if (k === ']') turnView(1);
    else if (k === 'd') { document.querySelector('[data-tool="' + (tool === 'build' ? 'delete' : 'build') + '"]').click(); }
    else if (k === 'z' && (ev.ctrlKey || ev.metaKey)) { ev.preventDefault(); undo(); }
  });

  window.addEventListener('resize', function () { if (resize()) draw(); });

  /* A pasted model link changes only the hash, which is not a navigation.
     Ignore the hash we write ourselves when clipboard access is refused. */
  window.addEventListener('hashchange', function () {
    var h = location.hash.slice(1);
    if (!h) return;
    try { if (decodeURIComponent(h) === encode(model)) return; } catch (e) { /* reload */ }
    location.reload();
  });

  /* ── Boot ──────────────────────────────────────────────────────────────── */

  var fromHash = location.hash.slice(1);
  if (fromHash) {
    try { model = decode(decodeURIComponent(fromHash)); } catch (e) { /* keep empty */ }
  } else {
    var s = readStore();
    if (s.current) model = decode(s.current);
  }
  if (!model.parts.length) {
    /* A first model so the stage is never an empty grid: something small,
       legal and obviously editable. */
    model = decode('1|Starter|p4x6,green,0,0,0,0;b2x4,red,0,1,0,0;b2x4,red,2,1,2,0;' +
                   'b1x2,white,0,4,0,0;s2x2,blue,1,4,2,0;r1x1,yellow,3,1,1,0');
  }

  document.getElementById('name').value = model.name;
  buildKinds(); buildParts(); buildColours(); renderSaved();
  resize(); fitView(); draw();
}());
