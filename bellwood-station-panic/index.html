function drawPixelText(str, x, y, scale = 2, color = C.ink, shadow = null, align = "left") {
  str = String(str).toUpperCase();
  const width = measurePixelText(str, scale);

  if (align === "center") x -= width / 2;
  if (align === "right") x -= width;

  if (shadow) drawPixelTextRaw(str, x + scale, y + scale, scale, shadow);
  drawPixelTextRaw(str, x, y, scale, color);
}

function drawPixelTextRaw(str, x, y, scale, color) {
  let cx = Math.round(x);
  for (const ch of str) {
    const glyph = FONT[ch] || FONT["?"];
    for (let row = 0; row < glyph.length; row++) {
      for (let col = 0; col < glyph[row].length; col++) {
        if (glyph[row][col] === "1") {
          px(cx + col * scale, y + row * scale, scale, scale, color);
        }
      }
    }
    cx += (glyph[0].length + 1) * scale;
  }
}

function measurePixelText(str, scale = 2) {
  str = String(str).toUpperCase();
  let width = 0;
  for (const ch of str) {
    const glyph = FONT[ch] || FONT["?"];
    width += (glyph[0].length + 1) * scale;
  }
  return width;
}

function rect(data){return{x:data[0],y:data[1],w:data[2],h:data[3]};}
function passable(x,y){if(x<24||x>776||y>446)return false;if(y<158&&!(x>=DOOR.x+6&&x<=DOOR.x+DOOR.w-6&&y>=147))return false;const f=rectFeet(x,y);if(station.solids.some(r=>overlap(f,rect(r))))return false;if(events.some(e=>e.type==='trolley'&&e.phase==='active'&&overlap(f,rect(e.rect))))return false;return true;}
function move(dx,dy){if(passable(player.x+dx,player.y))player.x+=dx;if(passable(player.x,player.y+dy))player.y+=dy;}
function held(k){return keys.has(k)||[...pointers.values()].includes(k);}

function action(kind){unlockAudio();if(kind==='mute'){save.muted=!save.muted;persist();syncControls();return;}

 if(kind==='new'){if(save.unlocked>0||save.complete){previousState=state;setState('confirm-new');}else{save.unlocked=0;save.complete=false;freshStation(0);}return;}
 if(kind==='retry'){if(state==='confirm-new'){setState(previousState);return;}if(state==='start'||state==='journey-complete'){action('new');return;}if(state!=='departing')freshStation(stationIndex);return;}
 if(kind!=='interact')return;
 if(state==='confirm-new'){save.unlocked=0;save.complete=false;persist();freshStation(0);}
 else if(state==='start')freshStation(save.unlocked);
 else if(state==='briefing'||state==='dialogue')advanceDialogue();
 else if(state==='playing')interact();
 else if(state==='paused')setState(previousState);
 else if(state==='failed')freshStation(stationIndex);

function wrap(text,width){const lines=[];let line='';for(const word of String(text).toUpperCase().split(/\s+/)){if(measurePixelText(line+(line?' ':'')+word,1)<=width){line+=(line?' ':'')+word;continue;}if(line)lines.push(line);line='';for(const ch of word){if(measurePixelText(line+ch,1)>width){lines.push(line);line='';}line+=ch;}}if(line)lines.push(line);return lines;}
function textBlock(text,x,y,width,maxLines=4){wrap(text,width).slice(0,maxLines).forEach((l,i)=>drawPixelText(l,x,y+i*10,1,C.ink));}
function hud(){box(2,2,476,40,C.cream,C.ink);drawPixelText('BAGS '+bags.filter(b=>b.found).length+'/4',10,9,2,C.cream);drawPixelText('TRAIN '+Math.ceil(clock),143,9,2,clock<15?C.pink:C.cream);drawPixelText('PANIC',282,9,1,C.cream);box(318,7,91,14,C.cream,C.navy);px(321,10,85*panic/100,8,panic>75?C.red:C.gold);drawPixelText(Math.ceil(panic)+'%',466,10,1,C.cream,null,'right');drawPixelText((stationIndex+1)+'/5 '+station.name,10,29,1,C.gold);drawPixelText('ERRAND '+(questStep===2?'DONE':questStep===1?'DELIVER':'OPEN'),285,29,1,C.cream);}
function panel(){box(2,282,476,H-284,C.cream,C.ink);box(7,287,466,H-294,C.ink,C.cream2);const talking=['briefing','dialogue'].includes(state);let title=talking?speaker:'YOU',message=noticeTime>0?notice:'Collect four suitcases and finish the station errand. The gold marker points to your next objective.';
 if(state==='playing'&&awaitingFirstAction){title='READY TO GO';message=touchMode?'Hold an arrow to move. Collect four bags. Follow TASK for your errand. The clock starts when you move.':'WASD or arrows move. Collect four bags. Follow TASK for your errand. The clock starts when you move.';}
 if(talking)message=pages[pageIndex];
 if(state==='paused'){title='PAUSED';message=previousState==='briefing'?'Paused. Tap RESUME, then NEXT or BEGIN to finish the briefing. Arrows work during play.':'Paused. Tap RESUME to continue. Arrows work during play.';}
 if(state==='failed'){title='MISSED DEPARTURE';message=pages[0];}
 if(state==='station-complete'){title='TRAIN CAUGHT';message=pages[0];}
 if(state==='journey-complete'){title='YOU MADE IT';message=pages[0];}
 if(state==='departing'){title='CONDUCTOR';message='Doors closing. Next stop, another little adventure.';}
 if(state==='start'){title='FIVE STATIONS. ONE FESTIVAL.';message='Four bags, one errand at each stop. WASD/arrows move. SPACE talks. Touch buttons work too. '+(storageOK?'Your completed stops are saved on this device.':'Saving is unavailable here; you can still play.');}
 if(state==='confirm-new'){title='START AGAIN?';message='Start a new journey and clear completed stops? YES, NEW confirms. CANCEL keeps your progress.';}
 if(touchMode&&state==='start')message='Four bags and one errand at each stop. Arrows move. Tap to talk. '+(storageOK?'Completed stops save on this device.':'Saving unavailable. You can still play.');
 if(touchMode)message=message.replace(/Press R/g,'Tap RETRY').replace('WASD/arrows move. SPACE talks. Touch buttons work too.','Arrows move. The action button talks or picks up items.');
 const portraitY=touchMode?334:305;px(12,portraitY,54,44,C.mintDark);ctx.save();ctx.beginPath();ctx.rect(12,portraitY,54,44);ctx.clip();ctx.translate(15,portraitY+2);ctx.scale(2,2);if(title==='DOG')drawDogPortrait(0,0);else if(title==='CONDUCTOR')drawConductorPortrait(0,0);else if(talking&&title!=='YOU'){const a=actors.find(n=>n.name===title);px(3,10,18,15,a?.coat||C.green);px(6,3,12,11,C.tan);px(4,0,16,4,C.brown);px(8,7,2,2,C.ink);px(14,7,2,2,C.ink);}else drawPlayerPortrait(0,0);ctx.restore();
 const objectiveLine=state==='start'?'A FIVE-STATION JOURNEY':state==='journey-complete'?'THE LANTERN FESTIVAL':objective();wrap(objectiveLine,touchMode?225:450).slice(0,2).forEach((l,i)=>drawPixelText(l,13,291+i*18,TEXT_SCALE,C.ink));const titleY=touchMode?330:302;px(76,titleY,Math.min(391,measurePixelText(title,TEXT_SCALE)+10),TEXT_SCALE*7+3,C.ink);drawPixelText(title,81,titleY+2,TEXT_SCALE,C.cream);wrap(message,TEXT_WIDTH).slice(0,TEXT_LINES).forEach((l,i)=>drawPixelText(l,77,(touchMode?350:316)+i*(touchMode?18:10),TEXT_SCALE,C.ink));
 if(talking)drawPixelText((pageIndex+1)+'/'+pages.length+' '+(pageIndex===pages.length-1?'CLOSE':'NEXT'),466,H-16,1,C.ink,null,'right');else if(carried)drawPixelText('CARRYING '+carried,466,H-16,1,C.ink,null,'right');}
function titleScene(){px(0,44,480,236,'#314c59');for(let y=44;y<280;y+=8)px(0,y,480,4,'#385460');for(let x=25;x<480;x+=45){px(x,48,1,23,C.ink);box(x-6,67,14,20,C.brown,x%2?C.gold:C.pink);}drawPixelText('BELLWOOD',240,112,4,C.cream,null,'center');drawPixelText('STATION PANIC',240,151,2,C.gold,null,'center');drawPixelText('A FIVE-STATION JOURNEY - V2.0.2',240,179,1,C.cream,null,'center');for(let i=0;i<5;i++){box(103+i*56,205,48,29,C.ink,i<=save.unlocked?'#6b997b':'#49616a');drawPixelText(i+1,126+i*56,212,2,C.cream,null,'center');}drawPixelText(save.complete?'FESTIVAL REACHED':save.unlocked?'CONTINUE YOUR JOURNEY':'YOUR TRAIN IS WAITING',240,256,1,C.cream,null,'center');}
function festivalScene(){px(0,44,480,236,'#243649');for(let x=18;x<480;x+=36){px(x,44,1,27,C.ink);box(x-5,67,12,18,C.brown,x%72?C.gold:C.pink);}px(0,191,480,89,'#ad8e7e');drawPixelText('WELCOME, EVERYONE!',240,110,2,C.cream,null,'center');drawPixelText('THE LANTERN FESTIVAL',240,144,1,C.gold,null,'center');for(let i=0;i<5;i++)human({x:130+i*45,y:235,coat:[C.navy,'#bc6485','#60854e','#9966ac',C.green][i],facing:'down'});drawDog({x:367,y:236});}
function render(){ctx.clearRect(0,0,W,H);if(state==='start'||state==='confirm-new')titleScene();else if(state==='journey-complete')festivalScene();else drawWorld();hud();panel();syncControls();}
// Fixed simulation steps maintain collision/event behaviour across refresh rates.
let lastTime=performance.now(),accumulator=0;
function loop(now){const delta=Math.min((now-lastTime)/1000,.1);lastTime=now;if(!document.hidden){accumulator+=delta;while(accumulator>=1/60){update(1/60);accumulator-=1/60;}}else accumulator=0;render();requestAnimationFrame(loop);}
setupInput();syncControls();resize();requestAnimationFrame(loop);
</script></body></html>
