<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Less Noise</title>
<meta name="description" content="A quiet companion for two weeks off.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Less Noise">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#CF9886" id="themeColor">
<meta name="color-scheme" content="light dark">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<style>
:root{
  --ink:#1E2233;
  --ink-2:rgba(30,34,51,.66);
  --ink-3:rgba(30,34,51,.42);
  --line:rgba(30,34,51,.10);
  --fill:rgba(30,34,51,.07);
  --fill-press:rgba(30,34,51,.13);
  --glass:rgba(255,255,255,.58);
  --glass-strong:rgba(255,255,255,.86);
  --glass-edge:rgba(255,255,255,.7);
  --shadow:0 14px 34px rgba(46,36,70,.10);
  --done:#4E7A68;
  --on-done:#fff;
  --scrim:rgba(20,18,30,.28);
  --round:ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,system-ui,"Segoe UI",Roboto,sans-serif;
  --text:-apple-system,BlinkMacSystemFont,system-ui,"SF Pro Text","Segoe UI",Roboto,sans-serif;
  --sky-top:#CF9886;--sky-mid:#EBB9A2;--sky-low:#F8E3D3;--glow:#FFD9B8;
}
body[data-mode="reset"]{--sky-top:#8DAFC0;--sky-mid:#C6D7DC;--sky-low:#F3E8DA;--glow:#FFE9C9}
body[data-mode="trip"]{--sky-top:#79ACD3;--sky-mid:#B8D4E6;--sky-low:#F6E5BF;--glow:#FFE6A6}
body[data-mode="rest"]{--sky-top:#9B92C2;--sky-mid:#CDBFDD;--sky-low:#F2E6EE;--glow:#F7D2DF}
body[data-mode="return"]{--sky-top:#7FB4A3;--sky-mid:#BCD9CC;--sky-low:#EEF3EA;--glow:#FFF0C8}

@media (prefers-color-scheme:dark){
  :root{
    --ink:#F1EDF4;
    --ink-2:rgba(241,237,244,.70);
    --ink-3:rgba(241,237,244,.44);
    --line:rgba(255,255,255,.10);
    --fill:rgba(255,255,255,.09);
    --fill-press:rgba(255,255,255,.16);
    --glass:rgba(26,28,42,.50);
    --glass-strong:rgba(30,32,48,.92);
    --glass-edge:rgba(255,255,255,.09);
    --shadow:0 14px 34px rgba(0,0,0,.28);
    --done:#8CC5AC;
    --on-done:#11201A;
    --scrim:rgba(0,0,0,.5);
    --sky-top:#151A2D;--sky-mid:#2D2540;--sky-low:#4B2F38;--glow:#8A4E45;
  }
  body[data-mode="reset"]{--sky-top:#121C28;--sky-mid:#1F2E3B;--sky-low:#36393E;--glow:#5E5140}
  body[data-mode="trip"]{--sky-top:#0E1D30;--sky-mid:#1B3249;--sky-low:#3D3830;--glow:#7A6234}
  body[data-mode="rest"]{--sky-top:#14152A;--sky-mid:#24213E;--sky-low:#3A2C48;--glow:#5E3F64}
  body[data-mode="return"]{--sky-top:#0F1F1D;--sky-mid:#1C3230;--sky-low:#2F3A35;--glow:#5D6448}
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;background:var(--sky-low)}
body{
  margin:0;min-height:100dvh;color:var(--ink);font-family:var(--text);
  font-size:17px;line-height:1.4;background:transparent;
  -webkit-font-smoothing:antialiased;overflow-x:hidden;
}
button,input{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation;-webkit-user-select:none;user-select:none}
:focus-visible{outline:3px solid color-mix(in srgb,var(--ink) 55%,transparent);outline-offset:3px;border-radius:14px}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* The sky: the one memorable thing */
.sky{position:fixed;inset:0;z-index:-1;overflow:hidden;
  background:linear-gradient(180deg,var(--sky-top) 0%,var(--sky-mid) 42%,var(--sky-low) 78%,var(--sky-low) 100%)}
.sky::before{content:"";position:absolute;width:120vmax;height:120vmax;left:20%;top:12%;
  background:radial-gradient(closest-side,var(--glow),transparent 70%);opacity:.75;
  animation:drift 36s ease-in-out infinite alternate}
.sky::after{content:"";position:absolute;left:0;right:0;top:0;height:calc(env(safe-area-inset-top) + 40px);
  background:linear-gradient(rgba(40,24,48,.14),transparent)}
@media (prefers-color-scheme:dark){.sky::after{background:linear-gradient(rgba(0,0,0,.25),transparent)}}
@keyframes drift{from{transform:translate3d(-8%,0,0) scale(1)}to{transform:translate3d(6%,-6%,0) scale(1.08)}}

main{max-width:560px;margin:0 auto;padding:0 18px calc(120px + env(safe-area-inset-bottom))}
.view{animation:fade .35s ease both}
.view[hidden]{display:none}
@keyframes fade{from{opacity:0}to{opacity:1}}

/* Today hero */
.hero{padding:calc(env(safe-area-inset-top) + 44px) 6px 26px}
.label{margin:0 0 6px;font:600 17px/1.2 var(--round);color:var(--ink-2)}
.date{margin:0;font-family:var(--round);font-size:42px;line-height:1.04;letter-spacing:-.02em}
.date .wd{display:block;font-weight:700}
.date .dm{display:block;font-weight:400;color:var(--ink-2)}
.msg{margin:26px 0 0;font:600 25px/1.22 var(--round);letter-spacing:-.01em;max-width:19ch;text-wrap:balance}
.sub{margin:10px 0 0;font-size:17px;color:var(--ink-2);max-width:32ch;text-wrap:pretty}
.sub.edit{display:block;margin:4px 0 0;padding:7px 0;min-height:44px;border:0;background:none;text-align:left;line-height:1.4;max-width:34ch}
.sub.edit svg{display:inline-block;width:14px;height:14px;margin-left:7px;vertical-align:-1px;opacity:.55}
.sub .ghost{color:var(--ink-3)}

body.intro .hero > *{animation:rise .9s cubic-bezier(.2,.7,.2,1) both}
body.intro .hero > :nth-child(2){animation-delay:.08s}
body.intro .hero > :nth-child(3){animation-delay:.22s}
body.intro .hero > :nth-child(4){animation-delay:.32s}
body.intro .stack{animation:rise .9s .42s cubic-bezier(.2,.7,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

.stack{display:flex;flex-direction:column;gap:14px}

.card{background:var(--glass);border:1px solid var(--glass-edge);border-radius:26px;padding:18px;
  box-shadow:var(--shadow);-webkit-backdrop-filter:blur(24px) saturate(1.6);backdrop-filter:blur(24px) saturate(1.6)}
.card h2{margin:0;font:600 19px/1.25 var(--round)}
.card .meta{margin:3px 0 0;font-size:15px;color:var(--ink-2)}

/* The day: plans are quiet lines, jobs have a tick */
.day{padding:4px 0}
.item{display:grid;grid-template-columns:46px 1fr;column-gap:8px;align-items:center;min-height:60px;padding:4px 14px 4px 10px;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.mark{width:46px;height:46px;display:grid;place-items:center}
.mark i{width:8px;height:8px;border-radius:50%;background:var(--ink-3)}
.mark.ring i{width:26px;height:26px;background:none;border:2px dashed var(--ink-3);opacity:.6}
.t{display:block;font-size:17px;line-height:1.3}
.m{display:block;margin-top:2px;font-size:14px;line-height:1.35;color:var(--ink-2)}
.open-job{display:grid;grid-template-columns:1fr 14px;gap:10px;align-items:center;width:100%;min-height:52px;padding:6px 0;border:0;background:none;text-align:left}
.open-job > svg{width:12px;height:12px;color:var(--ink-3)}
.check{width:46px;height:46px;border:0;background:none;padding:0;display:grid;place-items:center;border-radius:50%}
.check span{width:30px;height:30px;border-radius:50%;border:2px solid var(--ink-3);display:grid;place-items:center;transition:background .25s,border-color .25s,transform .25s}
.check svg{width:16px;height:16px;opacity:0;transition:opacity .2s}
.check:active span{transform:scale(.9)}
.item.done .check span{background:var(--done);border-color:var(--done)}
.item.done .check svg{opacity:1}
.item.done .t,.item.skipped .t{color:var(--ink-2)}
.item.skipped .t{text-decoration:line-through;text-decoration-color:var(--ink-3)}
.item.just .check span{animation:pop .45s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{0%{transform:scale(.7)}100%{transform:scale(1)}}

/* Gentle blocks */
.present{padding:8px 6px 4px}
.present h2{margin:0;font:600 20px/1.25 var(--round)}
.present p{margin:6px 0 0;font-size:16px;color:var(--ink-2);max-width:34ch}

.fancy .ask{margin:0;font-size:15px;color:var(--ink-2)}
.fancy .idea{margin:4px 0 0;font:500 20px/1.3 var(--round);text-wrap:pretty}
.fancy .or{margin:8px 0 0;font-size:14px;color:var(--ink-3)}

ul.calm{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:10px}
ul.calm li{display:grid;grid-template-columns:14px 1fr;gap:10px;font-size:16px;line-height:1.4}
ul.calm li::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--ink-3);margin-top:8px}
ol.first{margin:10px 0 0;padding-left:22px;font:500 19px/1.4 var(--round)}
ol.first li{margin:6px 0}
ol.first small{font:400 15px var(--text);color:var(--ink-2)}

.quiet{margin:54px 0 0;text-align:center;color:var(--ink-2)}
.quiet p{margin:0 auto;font:500 20px/1.3 var(--round);max-width:20ch;text-wrap:balance}
.quiet svg{display:block;width:120px;height:24px;margin:22px auto 0;color:var(--ink-3)}

/* Fortnight */
.ftop{padding:calc(env(safe-area-inset-top) + 44px) 6px 22px}
.ftop h1{margin:0;font:700 34px/1.1 var(--round);letter-spacing:-.02em}
.ftop p{margin:8px 0 0;color:var(--ink-2);max-width:34ch}
.list{padding:0}
.row{display:grid;grid-template-columns:92px 1fr;gap:12px;padding:14px 16px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .when{font:600 15px/1.35 var(--round);color:var(--ink-2)}
.row .what{font-size:16px;line-height:1.4}
.row .what .none{color:var(--ink-3)}
.row.now{background:color-mix(in srgb,var(--glass-strong) 55%,transparent)}
.row.now:first-child{border-radius:26px 26px 0 0}
.row.now:last-child{border-radius:0 0 26px 26px}
.row.past .when,.row.past .what{opacity:.6}
.tag{display:inline-block;margin-left:6px;padding:1px 8px;border-radius:10px;background:var(--fill);font-size:12px;font-weight:600;color:var(--ink-2);vertical-align:2px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 14px;border:0;border-radius:22px;background:var(--fill);font-size:14px;font-weight:600;color:var(--ink)}
.chip:active{background:var(--fill-press)}
.chip.done{background:color-mix(in srgb,var(--done) 24%,transparent)}
.chip.skipped{color:var(--ink-3);text-decoration:line-through}
.chip svg{width:12px;height:12px}

/* Tab bar */
.tabs{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom));transform:translateX(-50%);
  display:flex;gap:4px;padding:5px;border-radius:30px;background:var(--glass);border:1px solid var(--glass-edge);
  box-shadow:0 10px 30px rgba(30,20,50,.16);-webkit-backdrop-filter:blur(26px) saturate(1.7);backdrop-filter:blur(26px) saturate(1.7);z-index:5}
.tabs button{min-width:112px;min-height:46px;border:0;border-radius:24px;background:none;font:600 16px var(--round);color:var(--ink-2);transition:background .25s,color .25s}
.tabs button[aria-pressed="true"]{background:var(--glass-strong);color:var(--ink);box-shadow:0 2px 8px rgba(30,20,50,.10)}

/* Sheet */
.scrim{position:fixed;inset:0;background:var(--scrim);opacity:0;pointer-events:none;transition:opacity .25s;z-index:9}
.scrim.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:10;max-width:560px;margin:0 auto;
  background:var(--glass-strong);border-radius:28px 28px 0 0;padding:10px 18px calc(18px + env(safe-area-inset-bottom));
  -webkit-backdrop-filter:blur(30px);backdrop-filter:blur(30px);transform:translateY(105%);visibility:hidden;
  transition:transform .32s cubic-bezier(.2,.8,.2,1),visibility 0s .32s;max-height:86dvh;overflow:auto}
.sheet.open{transform:none;visibility:visible;transition:transform .32s cubic-bezier(.2,.8,.2,1),visibility 0s}
.grab{width:38px;height:5px;border-radius:3px;background:var(--ink-3);margin:2px auto 14px;opacity:.6}
.sheet h2{margin:0 4px 4px;font:600 21px/1.25 var(--round)}
.sheet .lead{margin:0 4px 14px;font-size:15px;color:var(--ink-2)}
.sheet ol.steps{margin:0 4px 16px;padding-left:22px;font-size:16px;line-height:1.45}
.sheet ol.steps li{margin:4px 0}
.days{display:grid;gap:8px}
.days button{min-height:52px;border:0;border-radius:16px;background:var(--fill);text-align:left;padding:0 16px;font-size:17px;display:flex;justify-content:space-between;align-items:center}
.days button:active{background:var(--fill-press)}
.days button[aria-current="true"]{box-shadow:inset 0 0 0 2px var(--ink-3)}
.days button.primary{justify-content:center;background:var(--ink);color:var(--glass-strong);font-weight:600}
.days small{font-size:14px;color:var(--ink-2)}
.note-input{width:100%;min-height:54px;border-radius:16px;border:1px solid var(--line);background:var(--fill);padding:0 16px;font-size:17px}
.note-input::placeholder{color:var(--ink-3)}
.cancel{margin-top:12px;width:100%;min-height:52px;border:0;border-radius:16px;background:none;font:600 17px var(--round);color:var(--ink-2)}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>
</head>
<body class="intro" data-mode="free">
<div class="sky" aria-hidden="true"></div>

<main>
  <section class="view" id="today" aria-label="Today"></section>
  <section class="view" id="fortnight" aria-label="The fortnight" hidden></section>
</main>

<nav class="tabs" aria-label="Views">
  <button type="button" data-view="today" aria-pressed="true">Today</button>
  <button type="button" data-view="fortnight" aria-pressed="false">Fortnight</button>
</nav>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
  <div class="grab" aria-hidden="true"></div>
  <h2 id="sheetTitle"></h2>
  <div id="sheetBody"></div>
  <button type="button" class="cancel" data-act="close-sheet">Cancel</button>
</div>

<script>
(function(){
"use strict";

/* ---------- Fixed facts ---------- */
const START = "2026-10-24", LAST = "2026-11-08", OP = "2026-11-03", BACK = "2026-11-09", WORK = "2026-11-02";
const TRIP = ["2026-10-27","2026-10-28","2026-10-29"];
const WD = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
const MO = ["January","February","March","April","May","June","July","August","September","October","November","December"];

/* Jobs get a tick and can be moved or skipped. Everything else is a plan, with no tick. */
const JOBS = {
  packing:   {title:"Packing", day:"2026-10-26", time:"Afternoon"},
  cards:     {title:"Birthday cards", day:"2026-10-26"},
  washing:   {title:"Washing and unpacking", day:"2026-10-30"},
  checkin:   {title:"Work check-in", day:"2026-10-30", line:"Emails, and chase the onsite dates.",
              steps:["Deal with anything genuinely urgent.","Chase the onsite dates.","Stop at 45 minutes. Inbox zero is off the table."]},
  onsite:    {title:"Confirm the onsite", day:"2026-11-02", line:"Then book hotel and travel, if needed."},
  photos:    {title:"Photo and album orders", day:"2026-11-03", soft:true, also:["2026-11-04"], line:"From the sofa, if you're up to it."},
  finance:   {title:"Finance updates", day:"2026-11-04", soft:true},
  paperwork: {title:"Office paperwork", day:"2026-11-05", soft:true, line:"Keep, action, bin. If you're up to it.",
              steps:["Sort into three piles: keep, action, bin.","Write anything unresolved on one list. No need to solve it.","Stop at 60 minutes.","Whiteboard too, only if there's energy: photo it, wipe it, rewrite what's active."]},
  household: {title:"Light household jobs", day:"2026-11-05", soft:true},
  checkin2:  {title:"Work check-in", day:"2026-11-06", soft:true, line:"A quick look. Urgent things only."},
  attic:     {title:"Clear the attic", day:"2026-11-08", soft:true, line:"You sort and decide. Someone else lifts and climbs."}
};
const JOB_IDS = Object.keys(JOBS);

const DAYS = {
  "2026-10-24":{note:"A day out with the family, then an evening together.", items:[{p:"Day out with the family",fun:1},{p:"Evening together",t:"Evening",fun:1}]},
  "2026-10-25":{note:"The clocks went back last night. An extra hour, with nothing in it.", items:[]},
  "2026-10-26":{items:[{p:"Bowling",t:"Morning",fun:1},{j:"packing"},{j:"cards"}]},
  "2026-10-27":{note:"Day one of three.", items:[{p:"Away"}]},
  "2026-10-28":{note:"Day two of three.", items:[{p:"Away"}]},
  "2026-10-29":{note:"Last day away.", items:[{p:"Away"}]},
  "2026-10-30":{note:"A full one. The fun bits come first.", items:[{p:"Hollowwellyween day out",fun:1},{j:"washing"},{j:"checkin"},{p:"Treasure trail, then movie night",t:"Evening",fun:1}]},
  "2026-10-31":{note:"It's Halloween.", items:[{p:"Scarecrow trail",fun:1}]},
  "2026-11-01":{note:"A slow Sunday. That's the whole plan.", items:[]},
  "2026-11-02":{note:"Tomorrow's the procedure. Keep tonight light.", items:[{p:"Work, just for today"},{j:"onsite"}]},
  "2026-11-03":{note:"Rest starts the moment you're home.", items:[{p:"Procedure"},{p:"VisionQuest",fun:1},{j:"photos"}]},
  "2026-11-04":{note:"Dad's birthday and anniversary.", items:[{p:"VisionQuest",fun:1},{p:"Puzzle",fun:1},{j:"finance"}]},
  "2026-11-05":{note:"It's Bonfire Night. Watching from the window counts.", items:[{j:"paperwork"},{j:"household"},{p:"Puzzle or LEGO",fun:1}]},
  "2026-11-06":{note:"If your energy's low, that's allowed.", items:[{p:"Any other jobs, if you want"},{j:"checkin2"}]},
  "2026-11-07":{note:"Sitting in a cinema counts as rest.", items:[{p:"Kids' cinema",fun:1},{p:"Play day",fun:1}]},
  "2026-11-08":{note:"Back to work tomorrow.", items:[{j:"attic"}]},
  "2026-11-09":{note:"No need to catch up on everything today.", items:[{p:"Check-in",t:"9:30am"},{p:"Prep for Tuesday's workshop"},{p:"Travel to Sheffield"}]}
};

const MSG = {
  "2026-11-03":"Procedure today, then rest.",
  "2026-11-05":"Rest first. Light jobs only if you're up to it.",
  "2026-11-06":"Still recovering. Keep it light.",
  "2026-11-08":"Go gently. Someone else does the lifting."
};

const IDEAS = [
  "Fifteen minutes on last Christmas's puzzle.",
  "Build some LEGO you already own. No need to finish.",
  "An episode of VisionQuest. Just the show, no second screen."
];
const REST_IDEAS = [
  "An episode of VisionQuest from the sofa.",
  "Read something. A chapter is plenty.",
  "A few pieces of the puzzle, if sitting at the table is comfy.",
  "A small LEGO build on a tray."
];

/* ---------- Dates (UK time) ---------- */
function londonISO(d){
  try{
    const p = new Intl.DateTimeFormat("en-GB",{timeZone:"Europe/London",year:"numeric",month:"2-digit",day:"2-digit"}).formatToParts(d);
    const g = t => p.find(x=>x.type===t).value;
    return g("year")+"-"+g("month")+"-"+g("day");
  }catch(e){
    return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
  }
}
function today(){
  const q = new URLSearchParams(location.search).get("date");
  if (q && /^\d{4}-\d{2}-\d{2}$/.test(q)) return q;
  return londonISO(new Date());
}
function parts(iso){ const [y,m,d] = iso.split("-").map(Number); return {y,m,d,wd:new Date(Date.UTC(y,m-1,d)).getUTCDay()}; }
function addDays(iso,n){ const p=parts(iso), d=new Date(Date.UTC(p.y,p.m-1,p.d+n)); return d.toISOString().slice(0,10); }
function dayDiff(a,b){ const A=parts(a),B=parts(b); return Math.round((Date.UTC(B.y,B.m-1,B.d)-Date.UTC(A.y,A.m-1,A.d))/864e5); }
function shortDay(iso){ const p=parts(iso); return WD[p.wd].slice(0,3)+" "+p.d+" "+MO[p.m-1].slice(0,3); }
function longDay(iso){ const p=parts(iso); return WD[p.wd]+" "+p.d+" "+MO[p.m-1]; }
const ALL_DAYS = (()=>{ const a=[]; for(let d=START; d<=LAST; d=addDays(d,1)) a.push(d); return a; })();
const MOVE_DAYS = ALL_DAYS.filter(d => !TRIP.includes(d) && d!==OP);

function phaseOf(iso){
  if (iso < START) return "before";
  if (iso > BACK) return "after";
  if (iso === BACK) return "return";
  if (iso === OP) return "procedure";
  if (iso > OP) return "recovery";
  if (TRIP.includes(iso)) return "trip";
  if (iso === WORK) return "work";
  return "free";
}

/* ---------- Saved state (this phone only) ---------- */
const KEY = "lessnoise.v2", OLD_KEY = "lessnoise.v1";
const validDay = d => d===null || (typeof d==="string" && /^\d{4}-\d{2}-\d{2}$/.test(d) && d>=START && d<=LAST);
function fresh(){
  const jobs = {}; JOB_IDS.forEach(id => jobs[id] = {status:"open", day:JOBS[id].day});
  return {jobs, notes:{}};
}
function readNotes(src, into){
  if (!src || typeof src!=="object") return;
  Object.keys(src).forEach(k => {
    if (/^\d{4}-\d{2}-\d{2}$/.test(k) && typeof src[k]==="string" && src[k].trim()) into[k] = src[k].slice(0,140);
  });
}
function load(){
  const s = fresh();
  try{
    const raw = localStorage.getItem(KEY);
    if (raw){
      const d = JSON.parse(raw);
      JOB_IDS.forEach(id => {
        const x = d && d.jobs && d.jobs[id];
        if (!x) return;
        if (["open","done","skipped"].includes(x.status)) s.jobs[id].status = x.status;
        if (validDay(x.day)) s.jobs[id].day = x.day;
      });
      readNotes(d && d.notes, s.notes);
    } else {
      const old = localStorage.getItem(OLD_KEY);   // keep any lines written in the first version
      if (old){ const d = JSON.parse(old); readNotes(d && d.notes, s.notes); }
    }
  }catch(e){}
  return s;
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){} }
let state = load();
let just = null;

/* ---------- Bits ---------- */
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const TICK = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3.2 8.4l3 3 6.6-7" fill="none" stroke="var(--on-done)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const SMALL_TICK = TICK.replace('var(--on-done)','currentColor');
const CHEV = '<svg viewBox="0 0 12 12" aria-hidden="true"><path d="M4 2l4 4-4 4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const PENCIL = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M10.6 2.6l2.8 2.8M2.5 13.5l.7-3.4 7.4-7.5 2.8 2.8-7.5 7.4z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/></svg>';
const WAVE = '<svg viewBox="0 0 120 24" aria-hidden="true"><path d="M2.0 12.00 L4.3 14.87 L6.6 16.82 L9.0 17.58 L11.3 17.16 L13.6 15.79 L15.9 13.89 L18.2 11.89 L20.6 10.23 L22.9 9.17 L25.2 8.84 L27.5 9.19 L29.8 10.02 L32.2 11.08 L34.5 12.11 L36.8 12.90 L39.1 13.34 L41.4 13.41 L43.8 13.18 L46.1 12.77 L48.4 12.32 L50.7 11.95 L53.0 11.70 L55.4 11.61 L57.7 11.65 L60.0 11.75 L62.3 11.87 L64.6 11.96 L67.0 12.01 L69.3 12.02 L71.6 12.01 L73.9 12.00 L118.0 12.00" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';

/* What sits on a given day: plans in order, then jobs (moved-in jobs at the end, then gentle carry-overs). */
function itemsFor(t){
  const d = DAYS[t] || {items:[]}, out = [];
  d.items.forEach(it => {
    if (it.p) out.push(it);
    else if (state.jobs[it.j].day === t) out.push({j:it.j});
  });
  JOB_IDS.forEach(id => {
    if (state.jobs[id].day === t && !out.some(x => x.j===id)) out.push({j:id});
  });
  JOB_IDS.forEach(id => {
    const J = JOBS[id], s = state.jobs[id];
    if (J.also && J.also.includes(t) && s.status==="open" && s.day && s.day < t && !out.some(x => x.j===id)) out.push({j:id, carried:true});
  });
  return out;
}
function firmJobs(t){ return itemsFor(t).filter(x => x.j && !x.carried && !JOBS[x.j].soft); }
function modeFor(t){
  const ph = phaseOf(t);
  if (ph==="trip") return "trip";
  if (ph==="procedure" || ph==="recovery") return "rest";
  if (ph==="return") return "return";
  if (ph==="work") return "reset";
  if (ph==="free" && firmJobs(t).length) return "reset";
  return "free";
}

/* ---------- Today ---------- */
function message(t){
  const ph = phaseOf(t);
  if (ph==="before") return "Your break starts on Saturday 24 October.";
  if (ph==="after") return "The break's done.";
  if (ph==="trip") return "Today is for making memories. Nothing else needs doing.";
  if (ph==="work") return "One work day, then rest.";
  if (ph==="return") return "Welcome back. Three things, then see how you feel.";
  if (ph==="procedure" || ph==="recovery") return MSG[t] || "Rest is the plan today.";
  const firm = firmJobs(t), open = firm.filter(x => state.jobs[x.j].status==="open").length;
  if (open===1) return "One small job, then you're free.";
  if (open>1) return (open===2?"Two":open===3?"Three":"A few")+" jobs, then you're free.";
  if (firm.some(x => state.jobs[x.j].status==="done")) return "That's done. The rest of the day is yours.";
  return "Nothing you need to achieve today.";
}

function subLine(t){
  const ph = phaseOf(t);
  if (ph==="before") return '<p class="sub">Nothing to do here until then.</p>';
  if (ph==="after") return '<p class="sub">You can remove Less Noise from your Home Screen whenever you like.</p>';
  const own = state.notes[t], line = own || (DAYS[t] && DAYS[t].note) || "";
  return '<button type="button" class="sub edit" data-act="edit-note">' +
    (line ? esc(line) : '<span class="ghost">Add a line for today</span>') + PENCIL + '<span class="vh">, edit</span></button>';
}

function jobMeta(id, carried){
  const J = JOBS[id], s = state.jobs[id];
  if (s.status==="done") return "Done";
  if (s.status==="skipped") return "Skipped. That's fine.";
  if (carried) return "Still open from yesterday. No rush.";
  return [J.time, J.line || (J.soft ? "If you're up to it." : "")].filter(Boolean).join(". ");
}

function jobRow(id, carried){
  const J = JOBS[id], s = state.jobs[id];
  const cls = ["item","job"]; if (s.status!=="open") cls.push(s.status); if (just===id) cls.push("just");
  const meta = jobMeta(id, carried);
  const left = s.status==="skipped" ? '<span class="mark ring" aria-hidden="true"><i></i></span>' :
    '<button type="button" class="check" data-act="toggle" data-job="'+id+'" aria-label="'+esc((s.status==="done"?"Mark not done: ":"Mark done: ")+J.title)+'"><span>'+TICK+'</span></button>';
  return '<div class="'+cls.join(" ")+'">'+left+
    '<button type="button" class="open-job" data-act="job" data-job="'+id+'"><span><span class="t">'+esc(J.title)+'</span>'+
    (meta ? '<span class="m">'+esc(meta)+'</span>' : "")+'</span>'+CHEV+'</button></div>';
}
function planRow(it){
  return '<div class="item plan"><span class="mark" aria-hidden="true"><i></i></span><span><span class="t">'+esc(it.p)+'</span>'+
    (it.t ? '<span class="m">'+esc(it.t)+'</span>' : "")+'</span></div>';
}

function renderToday(){
  const t = today(), p = parts(t), ph = phaseOf(t), items = itemsFor(t);
  document.body.dataset.mode = modeFor(t);
  const tc = document.getElementById("themeColor");
  if (tc) tc.content = getComputedStyle(document.body).getPropertyValue("--sky-top").trim() || "#CF9886";

  let h = '<header class="hero"><p class="label">Today</p>' +
    '<h1 class="date"><span class="wd">'+WD[p.wd]+'</span><span class="dm">'+p.d+' '+MO[p.m-1]+'</span></h1>' +
    '<p class="msg">'+esc(message(t))+'</p>' + subLine(t) + '</header><div class="stack">';

  const inBreak = ph!=="before" && ph!=="after";

  if (ph==="return"){
    h += '<section class="card"><h2>Your first three</h2><ol class="first">' +
      items.filter(x=>x.p).map(x => '<li>'+esc(x.p)+(x.t ? ' <small>'+esc(x.t)+'</small>' : "")+'</li>').join("") + '</ol></section>';
  } else if (inBreak && ph!=="trip" && items.length){
    h += '<section class="card day" aria-label="Today\'s plan">' +
      items.map(x => x.p ? planRow(x) : jobRow(x.j, x.carried)).join("") + '</section>';
  }

  if (t===WORK){
    h += '<section class="card"><h2>Ready for tomorrow</h2><ul class="calm">' +
      '<li>Check your appointment time and the clinic\'s instructions.</li>' +
      '<li>Sort out how you\'re getting home.</li>' +
      '<li>Line up help with lifting the kids.</li>' +
      '<li>Sofa, snacks and VisionQuest, ready to go.</li></ul></section>';
  }

  if (ph==="procedure" || ph==="recovery"){
    h += '<section class="card"><h2>Looking after yourself</h2><ul class="calm">' +
      '<li>Follow your clinician\'s discharge instructions. They come first.</li>' +
      '<li>Let someone else lift the kids for now.</li>' +
      '<li>If something doesn\'t feel right, call the clinic or NHS 111.</li></ul></section>';
  }

  if (inBreak){
    let pb = "After breakfast works well. Put the phone in another room and just be there.";
    if (ph==="trip") pb = "Leave it in the bag for ten minutes. Longer, if it feels good.";
    if (ph==="procedure"||ph==="recovery") pb = "Sitting down counts. Put the phone out of reach and just be there.";
    if (ph==="work"||ph==="return") pb = "Before work starts. Phone in another room, ten minutes with the family.";
    h += '<section class="present"><h2>Ten minutes, phone elsewhere.</h2><p>'+pb+'</p></section>';
  }

  if (inBreak && !["trip","work","return"].includes(ph) && !items.some(x => x.fun)){
    const idea = (ph==="procedure"||ph==="recovery") ? REST_IDEAS[dayDiff(OP,t) % REST_IDEAS.length] : IDEAS[dayDiff(START,t) % IDEAS.length];
    h += '<section class="card fancy"><p class="ask">Fancy doing something?</p><p class="idea">'+esc(idea)+'</p><p class="or">Or nothing. That\'s fine too.</p></section>';
  }

  h += '</div><footer class="quiet"><p>Is this actually what I want to be doing right now?</p>'+WAVE+'</footer>';
  document.getElementById("today").innerHTML = h;
}

/* ---------- Fortnight ---------- */
function groups(){
  const g = [];
  ALL_DAYS.concat([BACK]).forEach(d => {
    if (TRIP.includes(d)){ if (d===TRIP[0]) g.push(TRIP.slice()); }
    else g.push([d]);
  });
  return g;
}
function chip(id){
  const J = JOBS[id], s = state.jobs[id];
  const label = J.title + (s.status==="done" ? ", done" : s.status==="skipped" ? ", skipped" : "");
  return '<button type="button" class="chip '+(s.status!=="open"?s.status:"")+'" data-act="job" data-job="'+id+'" aria-label="'+esc(label)+'">'+
    (s.status==="done" ? SMALL_TICK : "")+esc(J.title)+'</button>';
}
function renderFortnight(){
  const t = today();
  let h = '<header class="ftop"><h1>The fortnight</h1><p>24 October to 8 November. Back at work on Monday 9 November. Tap a job to tick, move or skip it.</p></header>';
  h += '<div class="card list">';
  groups().forEach(ds => {
    const first = ds[0], last = ds[ds.length-1];
    const when = ds.length>1 ? shortDay(first).replace(/ \w+$/,"")+" to "+shortDay(last) : shortDay(first);
    const plans = [], jobs = [];
    ds.forEach(d => itemsFor(d).forEach(x => {
      if (x.p && !plans.includes(x.p)) plans.push(x.p + (d===BACK && x.t ? " "+x.t : ""));
      if (x.j && !x.carried) jobs.push(x.j);
    }));
    const fixed = ds.some(d => TRIP.includes(d) || d===OP || d===BACK);
    const cls = ["row"]; if (ds.includes(t)) cls.push("now"); else if (last < t) cls.push("past");
    h += '<div class="'+cls.join(" ")+'"><div class="when">'+esc(when)+'</div><div class="what">' +
      (plans.length ? esc(plans.join(", ")) : (jobs.length ? "" : '<span class="none">Nothing planned</span>')) +
      (fixed ? '<span class="tag">Fixed</span>' : "") + (ds.includes(t) ? '<span class="tag">Today</span>' : "") +
      (jobs.length ? '<div class="chips">'+jobs.map(chip).join("")+'</div>' : "") + '</div></div>';
  });
  const loose = JOB_IDS.filter(id => state.jobs[id].day===null);
  if (loose.length){
    h += '<div class="row"><div class="when">No set day</div><div class="what"><div class="chips" style="margin-top:0">'+loose.map(chip).join("")+'</div></div></div>';
  }
  h += '</div><footer class="quiet"><p>Less is enough.</p>'+WAVE+'</footer>';
  document.getElementById("fortnight").innerHTML = h;
}

/* ---------- Sheet (job, move, note) ---------- */
const sheet = () => document.getElementById("sheet");
let sheetJob = null, noteDay = null;
function openSheet(title, body, focusSel){
  document.getElementById("sheetTitle").textContent = title;
  document.getElementById("sheetBody").innerHTML = body;
  document.getElementById("scrim").classList.add("open");
  sheet().classList.add("open");
  const f = document.querySelector(focusSel || "#sheetBody button");
  if (f){ f.focus({preventScroll:true}); if (f.select) f.select(); }
  setTimeout(fitSheet, 350);
}
function closeSheet(){
  sheetJob = null; noteDay = null;
  sheet().style.bottom = "";
  if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
  document.getElementById("scrim").classList.remove("open");
  sheet().classList.remove("open");
}
const vv = window.visualViewport;
function fitSheet(){
  if (!vv || !sheet().classList.contains("open")){ sheet().style.bottom = ""; return; }
  const kb = Math.max(0, Math.round(window.innerHeight - vv.height - vv.offsetTop));
  sheet().style.bottom = kb > 40 ? kb+"px" : "";
}
if (vv){ vv.addEventListener("resize", fitSheet); vv.addEventListener("scroll", fitSheet); }

function openJob(id){
  sheetJob = id;
  const J = JOBS[id], s = state.jobs[id], t = today();
  const when = s.day ? longDay(s.day) : "No set day";
  const lead = [when, J.time, J.line || (J.soft ? "If you're up to it." : "")].filter(Boolean).join(". ");
  let body = '<p class="lead">'+esc(lead)+'</p>';
  if (J.steps) body += '<ol class="steps">'+J.steps.map(x=>'<li>'+esc(x)+'</li>').join("")+'</ol>';
  body += '<div class="days">';
  if (s.status==="open"){
    body += '<button type="button" class="primary" data-act="sheet-done">Mark done</button>';
    if (MOVE_DAYS.some(d => d >= t) || s.day!==null) body += '<button type="button" data-act="sheet-move"><span>Move to another day</span></button>';
    body += '<button type="button" data-act="sheet-skip"><span>Skip it</span><small>That\'s fine</small></button>';
  } else if (s.status==="done"){
    body += '<button type="button" data-act="sheet-undo"><span>Mark as not done</span></button>';
  } else {
    body += '<button type="button" class="primary" data-act="sheet-undo">Bring it back</button>';
  }
  body += '</div>';
  openSheet(J.title, body);
}
function openMove(id){
  sheetJob = id;
  const s = state.jobs[id], t = today();
  const days = MOVE_DAYS.filter(d => d >= t);
  const body = '<div class="days">' +
    days.map(d => '<button type="button" data-act="move-to" data-day="'+d+'"'+(s.day===d?' aria-current="true"':"")+'><span>'+esc(longDay(d))+'</span><small>'+(d===t?"Today":(s.day===d?"Current":""))+'</small></button>').join("") +
    '<button type="button" data-act="move-to" data-day=""'+(s.day===null?' aria-current="true"':"")+'><span>No set day</span><small>Whenever, or never</small></button></div>';
  openSheet("Move "+JOBS[id].title.toLowerCase()+" to", body);
}
function openNote(){
  noteDay = today();
  const own = state.notes[noteDay] || "";
  const original = (DAYS[noteDay] && DAYS[noteDay].note) || "";
  const body = '<div class="days"><input id="noteInput" class="note-input" type="text" maxlength="140" enterkeyhint="done" autocomplete="off" aria-label="Today\'s line" value="'+esc(own || original)+'" placeholder="'+esc(original || "Say what today\'s about")+'">' +
    '<button type="button" class="primary" data-act="save-note">Save</button>' +
    (own ? '<button type="button" data-act="reset-note"><span>Use the original line</span></button>' : "") + '</div>';
  openSheet("Today's line", body, "#noteInput");
}
function saveNote(){
  const i = document.getElementById("noteInput");
  const v = i ? i.value.trim().slice(0,140) : "";
  const original = (noteDay && DAYS[noteDay] && DAYS[noteDay].note) || "";
  if (noteDay){ if (v && v!==original) state.notes[noteDay] = v; else delete state.notes[noteDay]; }
  closeSheet(); save(); render();
}

/* ---------- Wiring ---------- */
function render(){ renderToday(); renderFortnight(); just = null; }
function show(v){
  document.getElementById("today").hidden = v!=="today";
  document.getElementById("fortnight").hidden = v!=="fortnight";
  document.querySelectorAll(".tabs button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.view===v)));
  window.scrollTo(0,0);
}
function setStatus(id, st){ state.jobs[id].status = st; if (st==="done") just = id; save(); render(); }

document.addEventListener("click", e => {
  const el = e.target.closest("[data-act],[data-view]");
  if (!el) return;
  if (el.dataset.view){ show(el.dataset.view); return; }
  const act = el.dataset.act, id = el.dataset.job;
  if (act==="toggle"){ setStatus(id, state.jobs[id].status==="done" ? "open" : "done"); return; }
  if (act==="job"){ openJob(id); return; }
  if (act==="sheet-done"){ const j=sheetJob; closeSheet(); setStatus(j,"done"); return; }
  if (act==="sheet-skip"){ const j=sheetJob; closeSheet(); setStatus(j,"skipped"); return; }
  if (act==="sheet-undo"){ const j=sheetJob; closeSheet(); setStatus(j,"open"); return; }
  if (act==="sheet-move"){ openMove(sheetJob); return; }
  if (act==="move-to"){ const j=sheetJob; if (j){ state.jobs[j].day = el.dataset.day || null; state.jobs[j].status = "open"; } closeSheet(); save(); render(); return; }
  if (act==="close-sheet"){ closeSheet(); return; }
  if (act==="edit-note"){ openNote(); return; }
  if (act==="save-note"){ saveNote(); return; }
  if (act==="reset-note"){ if (noteDay) delete state.notes[noteDay]; closeSheet(); save(); render(); return; }
});
document.getElementById("scrim").addEventListener("click", closeSheet);
document.addEventListener("keydown", e => {
  if (e.key==="Escape" && sheet().classList.contains("open")) closeSheet();
  if (e.key==="Enter" && e.target.id==="noteInput"){ e.preventDefault(); saveNote(); }
});
try{ matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => render()); }catch(e){}

// Keep the date right: re-check when the app comes back and just after UK midnight.
let shownDay = today();
function refreshIfNewDay(){ const t = today(); if (t!==shownDay){ shownDay = t; render(); } }
document.addEventListener("visibilitychange", () => { if (!document.hidden) refreshIfNewDay(); });
window.addEventListener("pageshow", refreshIfNewDay);
setInterval(refreshIfNewDay, 60000);

render();
setTimeout(()=>document.body.classList.remove("intro"), 1600);

try{ if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); }catch(e){}
if ("serviceWorker" in navigator && (location.protocol==="https:" || location.hostname==="localhost" || location.hostname==="127.0.0.1")){
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(()=>{});
    navigator.serviceWorker.ready.then(r => { if (r.active) r.active.postMessage("refill"); }).catch(()=>{});
  });
}
})();
</script>
